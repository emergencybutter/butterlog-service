{# The Upload to FlySto button's behaviour, for any `[data-flysto-upload]` on the page:
   posts the flight to the service, which sends it to the pilot's FlySto, and says how
   that went. JSON, so another site can't post it with the pilot's cookie. #}
<style>
    .flysto-toast {
        position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 100;
        max-width: min(480px, calc(100vw - 32px));
        padding: 10px 14px; border-radius: var(--radius-sm);
        background: var(--surface); color: var(--text); border: 1px solid var(--border);
        box-shadow: var(--shadow); font-family: var(--font-body); font-size: 0.84rem;
    }
    .flysto-toast.is-error { border-color: var(--error); }
    .flysto-toast a { color: var(--accent-text); }
</style>
<script>
(function () {
    function toast(html, error) {
        document.querySelectorAll('.flysto-toast').forEach(t => t.remove());
        const t = document.createElement('div');
        t.className = 'flysto-toast' + (error ? ' is-error' : '');
        t.setAttribute('role', 'status');
        t.innerHTML = html;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), error ? 8000 : 4000);
    }
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    document.querySelectorAll('[data-flysto-upload]').forEach(btn => {
        const label = btn.textContent;
        btn.addEventListener('click', async () => {
            btn.disabled = true;
            btn.textContent = 'Uploading…';
            try {
                const r = await fetch(btn.dataset.flystoUpload, {
                    method: 'POST', credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' }, body: '{}',
                });
                if (r.ok) {
                    const data = await r.json().catch(() => ({}));
                    btn.textContent = 'On FlySto ✓';
                    const flysto = '<a href="https://www.flysto.net/" target="_blank" rel="noopener">your FlySto</a>';
                    toast(data.duplicate
                        ? 'Already on ' + flysto + ': it has this flight from an earlier upload.'
                        : 'Sent to ' + flysto + '. It shows there once FlySto has processed it.');
                    return;
                }
                const data = await r.json().catch(() => ({}));
                const msg = data.error || ('Upload failed (' + r.status + ')');
                const fix = /Settings/.test(msg) ? ' <a href="/content/settings#flysto">Open Settings</a>' : '';
                toast(esc(msg) + fix, true);
            } catch (e) {
                toast('Upload failed: the service could not be reached.', true);
            }
            btn.disabled = false;
            btn.textContent = label;
        });
    });
})();
</script>
