<!-- Maps / Graphs tabs for a flight detail view.

     Panes are `<section data-pane="...">`; the buttons carry the same names.
     Include after the page has called renderFlightDoc and set
     `window.flightHandle`, so a pane becoming visible can tell the renderer to
     re-measure - Leaflet and Chart.js both size themselves against their
     container at creation, and neither notices being un-hidden later. -->
<script>
(function () {
    const tabs = Array.prototype.slice.call(document.querySelectorAll('.subnav-tab[data-pane]'));
    const panes = Array.prototype.slice.call(document.querySelectorAll('section[data-pane]'));
    if (!tabs.length) return;
    const KEY = 'butterlog-flight-pane';

    function show(name) {
        tabs.forEach(function (t) {
            const on = t.dataset.pane === name;
            t.classList.toggle('is-on', on);
            t.setAttribute('aria-selected', on ? 'true' : 'false');
        });
        panes.forEach(function (p) { p.hidden = p.dataset.pane !== name; });
        const h = window.flightHandle;
        if (h && h.onPaneShown) h.onPaneShown(name);
        try { sessionStorage.setItem(KEY, name); } catch (e) {}
    }

    const known = function (name) { return tabs.some(function (t) { return t.dataset.pane === name; }); };

    // Mirror the open tab into the URL so the address bar is always a link to
    // what is on screen. replaceState, not a hash assignment: tab flips should
    // not pile up in the back button.
    function setHash(name) {
        const url = location.origin + location.pathname + location.search + (name === 'summary' ? '' : '#' + name);
        try { history.replaceState(history.state, '', url); } catch (e) {}
    }

    tabs.forEach(function (t) {
        t.addEventListener('click', function () { show(t.dataset.pane); setHash(t.dataset.pane); });
    });

    // A linked tab (`#replay`) wins. Otherwise carry the choice between
    // flights: someone comparing traces down a list should not have to re-pick
    // Graphs on every one.
    const linked = location.hash.slice(1);
    window.flightPaneLinked = known(linked) ? linked : null;
    let initial = 'summary';
    if (window.flightPaneLinked) {
        initial = window.flightPaneLinked;
    } else {
        try {
            const stored = sessionStorage.getItem(KEY);
            if (stored && known(stored)) initial = stored;
        } catch (e) {}
    }
    show(initial);
    setHash(initial);

    // The renderer may not exist yet on the live page, which builds its view
    // from the first poll. Re-announce once it does.
    window.flightPanesRefresh = function () {
        const on = tabs.filter(function (t) { return t.classList.contains('is-on'); })[0];
        if (on) show(on.dataset.pane);
    };
})();
</script>
