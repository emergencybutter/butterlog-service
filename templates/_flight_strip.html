{% include "_hud.html" %}
<!-- Drives the one-screen flight view (_flight_screen.html).

     `initFlightStrip(handle, opts)` wires the map controls, the bottom strip
     and the Debrief dialog to a rendered flight. Two modes:

     - Replay: every view follows the page's one replay cursor
       (window.FlightReplay). The altitude profile and the graph lanes scrub
       it; the instruments and readouts follow it.
     - Live (`opts.live`): there is no cursor to move yet - the replay only
       attaches once the track is complete - so the strip pins to now. The
       page calls `update(doc)` after each poll and `toReplay()` once the
       flight has ended, which turns the strip into the replay one.

     `opts.doc3d()` returns the document the 3D path is built from; the 3D
     map stays off until it returns one. -->
<script>
window.initFlightStrip = function (H, opts) {
    opts = opts || {};
    const S = H.state;
    const $ = id => document.getElementById(id);
    const store = {
        get(k, dflt) { try { const v = localStorage.getItem('butterlog-fv-' + k); return v === null ? dflt : JSON.parse(v); } catch (e) { return dflt; } },
        set(k, v) { try { localStorage.setItem('butterlog-fv-' + k, JSON.stringify(v)); } catch (e) {} },
    };
    const num = v => typeof v === 'number' && isFinite(v);
    const group = n => Math.round(n).toLocaleString('en-US');
    const signed = (n, digits) => (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n).toFixed(digits || 0);
    const parseTs = s => {
        if (typeof s === 'number') return s;
        if (!s) return null;
        const t = new Date(String(s).replace(' ', 'T') + (/[zZ]|[+-]\d\d:?\d\d$/.test(s) ? '' : 'Z')).getTime() / 1000;
        return isNaN(t) ? null : t;
    };
    const hhmm = e => new Date(e * 1000).toISOString().slice(11, 16);
    const sim = opts.sim || '';
    let mode = opts.live ? 'live' : 'replay';

    // The track grows on the live page, and `append` replaces these arrays
    // rather than extending them, so always read them off the state.
    const T = () => {
        const ts = S.timestamps, axis = S.axis || [0];
        return { ts, axis, N: ts.length, span: axis[axis.length - 1] || 0 };
    };
    const toPct = x => { const { span } = T(); return span > 0 ? Math.max(0, Math.min(span, x)) / span * 100 : 100; };

    // ── Header: one line of who, what and when, and the landing ─────────
    const evOf = t => ((S.summary || {}).events || []).filter(e => (e.eventType || e.event_type) === t);
    let grade = null;
    function renderHeader() {
        const sum = S.summary || {};
        const landing = evOf('landing').pop();
        const lvs = landing && (landing.touchdownFpm ?? landing.touchdown_fpm);
        const lg = landing && (landing.landingG ?? landing.landing_g);
        const chip = $('fv-grade');
        grade = null;
        if (num(lvs) && chip) {
            const a = Math.abs(lvs);
            grade = a < 150 ? ['butter', 'Butter'] : a < 250 ? ['smooth', 'Smooth'] : a < 350 ? ['firm', 'Firm'] : ['hard', 'Hard'];
            chip.className = 'fv-grade g-' + grade[0];
            // Some sims report nonsense load at touchdown (an MSFS flight here
            // logs -0.04 G); leave it out rather than print it.
            chip.textContent = `${grade[1]} landing · ${Math.round(a)} fpm` + (num(lg) && lg > 0.3 ? ` · ${lg.toFixed(2)} G` : '');
            chip.hidden = false;
        }
        const start = parseTs(sum.startTime || sum.start_time);
        const dur = sum.durationMinutes || sum.duration_minutes || 0;
        const date = start ? new Date(start * 1000).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' }) : '';
        const parts = [sum.aircraftTitle || sum.airframe_name, (sum.resolvedAirline || sum.resolved_airline || '').trim(),
                       opts.pilot || '', sim, date, dur ? fmtDur(dur) : ''].filter(Boolean);
        $('fv-meta').textContent = parts.join(' · ');
    }

    // ── Debrief dialog ───────────────────────────────────────────────────
    const dlg = $('fv-details');
    $('fv-details-open').addEventListener('click', () => {
        if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
        H.onPaneShown('details');
    });
    $('fv-details-close').addEventListener('click', () => dlg.close());
    dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
    // The app's "flight done" notification links here with #debrief.
    if (location.hash === '#debrief') $('fv-details-open').click();

    // ── Map: 2D / 3D terrain, fit ────────────────────────────────────────
    let mapMode = '2d', built3d = false;
    const mapBtns = Array.from(document.querySelectorAll('[data-map]'));
    const btn3d = mapBtns.filter(b => b.dataset.map === '3d')[0];
    function sync3dAvailable() {
        // The 3D path frames and scrubs the whole flight, so it waits for one.
        const ok = !!(opts.doc3d && opts.doc3d());
        btn3d.disabled = !ok;
        btn3d.title = ok ? '' : 'Available once the flight has landed';
    }
    function setMap(m) {
        if (m === '3d' && btn3d.disabled) return;
        mapMode = m;
        mapBtns.forEach(b => { const on = b.dataset.map === m; b.classList.toggle('is-on', on); b.setAttribute('aria-pressed', on); });
        $('map3d-section').hidden = m !== '3d';
        $('fv-map').classList.toggle('is-3d', m === '3d');
        if (m === '3d' && !built3d) { built3d = true; renderFlight3D(opts.doc3d()); }
        if (m === '3d' && window.flightDeck) window.flightDeck.redraw(true);
        if (m === '2d' && S.map) S.map.invalidateSize();
    }
    mapBtns.forEach(b => b.addEventListener('click', () => setMap(b.dataset.map)));
    $('fv-fit').addEventListener('click', () => {
        if (mapMode === '3d') { const r = $('m3d-reset'); if (r) r.click(); } else H.fitMap();
    });

    // ── Channels this flight carries ─────────────────────────────────────
    const f0 = v => Math.round(v).toString();
    const deg = v => String(Math.round(((v % 360) + 360) % 360)).padStart(3, '0') + '°';
    const CATALOGUE = [
        ['Flight', [
            ['alts', 'Altitude', v => group(v) + ' ft'],
            ['ias', 'Indicated airspeed', v => f0(v) + ' kt'],
            ['true_airspeed', 'True airspeed', v => f0(v) + ' kt'],
            ['ground_speed', 'Ground speed', v => f0(v) + ' kt'],
            ['vs', 'Vertical speed', v => signed(Math.round(v / 10) * 10).replace(/\d+/, m => group(+m)) + ' fpm'],
            ['baro', 'Altimeter setting', v => v.toFixed(2) + ' inHg'],
        ]],
        ['Attitude', [
            ['pitch', 'Pitch', v => signed(v, 1) + '°'],
            ['roll', 'Roll', v => signed(v, 1) + '°'],
            ['heading', 'Heading', deg],
            ['track', 'Ground track', deg],
            ['g_load', 'Load factor', v => v.toFixed(2) + ' G'],
        ]],
        ['Engine', [
            ['pct_power', 'Power', v => f0(v) + ' %'],
            ['rpm', 'RPM', v => group(v)],
            ['manifold', 'Manifold pressure', v => v.toFixed(1) + ' inHg'],
            ['fuel_flow', 'Fuel flow', v => v.toFixed(1) + ' gph'],
            ['oil_temp', 'Oil temperature', v => f0(v) + ' °F'],
            ['oil_press', 'Oil pressure', v => f0(v) + ' psi'],
        ]],
        ['Fuel', [
            ['fuel_left', 'Left tank', v => v.toFixed(1) + ' gal'],
            ['fuel_right', 'Right tank', v => v.toFixed(1) + ' gal'],
        ]],
        ['Environment', [
            ['oat', 'Outside air temperature', v => signed(v) + ' °C'],
            ['wind_speed', 'Wind speed', v => f0(v) + ' kt'],
            ['wind_dir', 'Wind direction', deg],
            ['magvar', 'Magnetic variation', v => signed(v, 1) + '°'],
        ]],
    ];
    const FMT = {};
    CATALOGUE.forEach(([, items]) => items.forEach(([k, label, fmt]) => { FMT[k] = { key: k, label, fmt }; }));
    let CH = [], CHAN = {}, chanKey = '';
    // What the flight has recorded so far; a live flight can gain a column.
    function refreshChannels() {
        CH = CATALOGUE.map(([name, items]) => [name, items.filter(([k]) => H.hasData(k))]).filter(([, items]) => items.length);
        CHAN = {};
        CH.forEach(([, items]) => items.forEach(([k]) => { CHAN[k] = FMT[k]; }));
        const key = Object.keys(CHAN).join(',');
        const changed = key !== chanKey;
        chanKey = key;
        return changed;
    }
    refreshChannels();

    function valueAt(arr, x) {
        const { axis, N } = T();
        if (!arr || !N) return null;
        let lo = 0, hi = N - 1;
        while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (axis[mid] <= x) lo = mid; else hi = mid - 1; }
        const j = Math.min(lo + 1, N - 1), a = arr[lo], b = arr[j];
        if (!num(a)) return num(b) ? b : null;
        if (!num(b) || axis[j] === axis[lo]) return a;
        return a + (b - a) * (x - axis[lo]) / (axis[j] - axis[lo]);
    }

    function sizeCanvas(cv) {
        const box = cv.parentElement, dpr = window.devicePixelRatio || 1;
        const w = box.clientWidth, h = box.clientHeight;
        if (!w || !h) return null;
        cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
        const ctx = cv.getContext('2d');
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, w, h);
        return { ctx, w, h };
    }
    const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

    function shadeGaps(ctx, w, h) {
        const { span } = T();
        if (!(span > 0)) return;
        // Only the long ones: cruise is thinned to a sample every few
        // minutes, and shading each of those gaps striped the whole strip.
        ctx.fillStyle = 'rgba(128,128,128,0.07)';
        (S.gaps || []).filter(g => g.skipped >= 600).forEach(g => {
            const x1 = g.from / span * w, x2 = g.to / span * w;
            if (x2 > x1) ctx.fillRect(x1, 0, x2 - x1, h);
        });
    }

    // ── Terrain under the track ──────────────────────────────────────────
    // From the same elevation tiles the 3D views draw. Sea and lakes come
    // back below zero (the tiles carry bathymetry), which is the surface the
    // aeroplane would meet, so clamp to zero. Tiles are kept, so a live
    // flight only fetches the ones its new track crosses.
    const terrain = { x: [], ft: [], ready: false, n: 0, busy: false };
    const tiles = {};
    function terrainAt(x) {
        if (!terrain.ready) return null;
        const xs = terrain.x;
        let lo = 0, hi = xs.length - 1;
        if (x <= xs[0]) return terrain.ft[0];
        if (x >= xs[hi]) return terrain.ft[hi];
        while (lo < hi - 1) { const mid = (lo + hi) >> 1; if (xs[mid] <= x) lo = mid; else hi = mid; }
        const f = (x - xs[lo]) / ((xs[hi] - xs[lo]) || 1);
        return terrain.ft[lo] + (terrain.ft[hi] - terrain.ft[lo]) * f;
    }
    function loadTerrain() {
        const { axis, N } = T();
        if (N < 2 || terrain.busy) return;
        terrain.busy = true;
        terrain.n = N;
        const step = Math.max(1, Math.floor(N / 400));
        const pts = [];
        for (let i = 0; i < N; i += step) if (num(S.lats[i]) && num(S.lons[i])) pts.push(i);
        if (pts[pts.length - 1] !== N - 1) pts.push(N - 1);
        const tileOf = (i, z) => {
            const n = 2 ** z, rad = S.lats[i] * Math.PI / 180;
            const x = (S.lons[i] + 180) / 360 * n;
            const y = (1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2 * n;
            return { x, y, key: z + '/' + Math.floor(x) + '/' + Math.floor(y) };
        };
        // As fine as a few dozen tiles allow: a long flight drops to coarser
        // posts, which a strip a few hundred pixels wide cannot tell apart.
        let z = 11, keys;
        for (; z > 5; z--) {
            keys = new Set(pts.map(i => tileOf(i, z).key));
            if (keys.size <= 40) break;
        }
        const load = key => key in tiles ? Promise.resolve() : new Promise(resolve => {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onerror = () => { tiles[key] = null; resolve(); };
            img.onload = () => {
                try {
                    const c = document.createElement('canvas');
                    c.width = img.width; c.height = img.height;
                    const ctx = c.getContext('2d', { willReadFrequently: true });
                    ctx.drawImage(img, 0, 0);
                    tiles[key] = { w: img.width, h: img.height, d: ctx.getImageData(0, 0, img.width, img.height).data };
                } catch (e) { tiles[key] = null; }
                resolve();
            };
            img.src = 'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/' + key + '.png';
        });
        Promise.all(Array.from(keys).map(load)).then(() => {
            const xs = [], fts = [];
            pts.forEach(i => {
                const t = tileOf(i, z), tile = tiles[t.key];
                if (!tile) return;
                const px = Math.min(tile.w - 1, Math.floor((t.x - Math.floor(t.x)) * tile.w));
                const py = Math.min(tile.h - 1, Math.floor((t.y - Math.floor(t.y)) * tile.h));
                const o = (py * tile.w + px) * 4, d = tile.d;
                xs.push(axis[i]);
                fts.push(Math.max(0, (d[o] * 256 + d[o + 1] + d[o + 2] / 256 - 32768) / 0.3048));
            });
            terrain.x = xs; terrain.ft = fts;
            terrain.ready = xs.length > 1;
            terrain.busy = false;
            if (terrain.ready) { $('fv-key-terrain').hidden = false; drawProfile(); renderReadouts(); }
        });
    }

    function niceTop(v) {
        const steps = [1000, 2000, 2500, 5000, 10000];
        for (const s of steps) if (v <= s * 2) return Math.ceil(v / (s / 2)) * (s / 2) || 1000;
        return Math.ceil(v / 10000) * 10000;
    }

    function drawProfile() {
        const g = sizeCanvas($('fv-profile-canvas'));
        if (!g) return;
        const { ctx, w, h } = g;
        const { axis, N, span } = T();
        let maxFt = 0;
        for (let i = 0; i < N; i++) if (S.alts[i] > maxFt) maxFt = S.alts[i];
        if (terrain.ready) terrain.ft.forEach(v => { if (v > maxFt) maxFt = v; });
        const top = niceTop(maxFt * 1.08 || 1000);
        $('fv-axis').innerHTML = `<span>${group(top)} ft</span><span>${group(top / 2)} ft</span><span>0</span>`;
        if (N < 2 || !(span > 0)) return;
        const y = ft => h - 2 - (Math.max(0, ft) / top) * (h - 6);
        shadeGaps(ctx, w, h);
        ctx.strokeStyle = 'rgba(128,128,128,0.12)';
        ctx.lineWidth = 1;
        [top / 2, top].forEach(v => { ctx.beginPath(); ctx.moveTo(0, Math.round(y(v)) + 0.5); ctx.lineTo(w, Math.round(y(v)) + 0.5); ctx.stroke(); });
        if (terrain.ready) {
            ctx.beginPath();
            ctx.moveTo(0, h);
            terrain.x.forEach((x, i) => ctx.lineTo(Math.min(x, span) / span * w, y(terrain.ft[i])));
            ctx.lineTo(Math.min(terrain.x[terrain.x.length - 1], span) / span * w, h);
            ctx.closePath();
            ctx.fillStyle = '#4a5641';
            ctx.fill();
        }
        ctx.beginPath();
        const step = Math.max(1, Math.floor(N / (w * 2)));
        for (let i = 0; i < N; i += step) {
            const px = axis[i] / span * w, py = y(S.alts[i] || 0);
            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.lineTo(w, y(S.alts[N - 1] || 0));
        ctx.strokeStyle = '#33b8a1';
        ctx.lineWidth = 2;
        ctx.lineJoin = 'round';
        ctx.stroke();
    }

    function renderEvents() {
        const { ts, N } = T();
        const out = [];
        const put = (e, text, cls) => {
            const t = parseTs(e && e.timestamp);
            if (t === null) return;
            out.push({ pct: toPct(H.epochToAxis(t)), text, cls });
        };
        const takeoff = evOf('takeoff')[0], landing = evOf('landing').pop();
        if (takeoff) put(takeoff, 'Takeoff ' + hhmm(parseTs(takeoff.timestamp)), '');
        // Recorded when the app sent them; otherwise where the aeroplane first
        // and last sat near its highest altitude, which is what the app means.
        // Live, the descent is only a descent once it has landed.
        let toc = evOf('top_of_climb')[0], tod = evOf('top_of_descent').slice(-1)[0];
        if ((!toc || !tod) && N > 1) {
            let max = 0;
            for (let i = 0; i < N; i++) if (S.alts[i] > max) max = S.alts[i];
            if (max > 3000) {
                let a = -1, b = -1;
                for (let i = 0; i < N; i++) if (S.alts[i] >= max * 0.97) { if (a < 0) a = i; b = i; }
                if (a > 0 && !toc && (mode !== 'live' || ts[N - 1] - ts[a] > 300)) toc = { timestamp: ts[a] };
                if (b > a && b < N - 1 && !tod && (mode !== 'live' || landing)) tod = { timestamp: ts[b] };
            }
        }
        if (toc) put(toc, 'Top of climb', 'lo');
        if (tod) put(tod, 'Top of descent', 'lo');
        if (landing) put(landing, 'Landing ' + hhmm(parseTs(landing.timestamp)) + (grade ? ' · ' + grade[1] : ''), grade ? 'g-' + grade[0] : '');
        // Labels run right from their mark, or left near the right edge. Keep
        // the first of any two in a row whose text would overlap - on a short
        // flight or a phone the climb and descent marks land on each other.
        const box = $('fv-profile').clientWidth || 600;
        const kept = [];
        out.sort((a, b) => a.pct - b.pct).forEach(o => {
            const x = o.pct / 100 * box, w = o.text.length * 6.6 + 12;
            o.end = x + w > box;
            o.l = o.end ? x - w : x;
            o.r = o.end ? x : x + w;
            o.row = o.cls === 'lo' ? 'lo' : 'hi';
            if (kept.some(k => k.row === o.row && o.l < k.r + 6 && k.l < o.r + 6)) return;
            kept.push(o);
        });
        // Each screenshot is a camera mark along the bottom, which opens it. Marks
        // closer than a mark's width share one, which opens the first and counts them.
        const groups = [];
        (S.screenshots || []).forEach((sc, i) => {
            const t = parseTs(sc.timestamp);
            if (t === null || t < ts[0] - 60 || t > ts[N - 1] + 60) return;
            const pct = Math.max(0, Math.min(100, toPct(H.epochToAxis(t))));
            const last = groups[groups.length - 1];
            if (last && (pct - last.pct) / 100 * box < 22) { last.n++; last.t1 = t; return; }
            groups.push({ pct, i, n: 1, t0: t, t1: t });
        });
        const shots = groups.map(g => {
            const span = hhmm(g.t0) === hhmm(g.t1) ? hhmm(g.t0) : `${hhmm(g.t0)}–${hhmm(g.t1)}`;
            const when = g.n > 1 ? `${g.n} screenshots ${span}` : `Screenshot ${span}`;
            return `<button type="button" class="fv-shot" style="left:${g.pct.toFixed(2)}%" data-shot="${g.i}" aria-label="${when}" title="${when}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>${g.n > 1 ? `<span class="n">${g.n}</span>` : ''}</button>`;
        }).join('');
        $('fv-events').innerHTML = kept.map(o =>
            `<span class="${o.cls}${o.end ? ' is-end' : ''}" style="left:${o.pct.toFixed(2)}%">${esc(o.text)}</span>`).join('') + shots;
    }

    // ── Lanes ────────────────────────────────────────────────────────────
    const DEFAULT = ['ias', 'vs', 'g_load'];
    const storedPick = store.get('channels', null);
    let picked = Array.isArray(storedPick) ? storedPick.slice() : DEFAULT.slice();
    const lanes = $('fv-lanes');
    const shown = () => picked.filter(k => CHAN[k]);

    function buildLanes() {
        const ks = shown();
        lanes.innerHTML = ks.map(k => `
            <div class="fv-lane-lbl"><span class="n">${esc(CHAN[k].label)}</span><span class="v" data-v="${k}">—</span></div>
            <div class="fv-plot fv-lane" data-lane="${k}">
                <canvas></canvas><span class="rng hi"></span><span class="rng lo"></span>
                <div class="fv-cursor"></div>
                <button type="button" class="x" data-remove="${k}" aria-label="Remove ${esc(CHAN[k].label)}">&#10005;</button>
            </div>`).join('');
        $('fv-lanes-empty').hidden = ks.length > 0;
        lanes.querySelectorAll('.fv-lane').forEach(wireScrub);
        document.querySelectorAll('.fv-count').forEach(c => { c.textContent = ks.length ? String(ks.length) : ''; });
        lanes.querySelectorAll('[data-remove]').forEach(b => b.addEventListener('click', e => {
            e.stopPropagation();
            setPicked(picked.filter(k => k !== b.dataset.remove));
        }));
        lanes.querySelectorAll('.fv-plot').forEach(wireScrub);
        drawLanes();
        placeCursors();
        renderLaneValues();
    }

    function drawLanes() {
        const line = css('--text-2') || '#b9c0ba';
        const { axis, N, span } = T();
        lanes.querySelectorAll('[data-lane]').forEach(el => {
            const k = el.dataset.lane, arr = S[k], ch = CHAN[k];
            const g = sizeCanvas(el.querySelector('canvas'));
            if (!g || !ch || !(span > 0)) return;
            const { ctx, w, h } = g;
            let lo = Infinity, hi = -Infinity;
            for (let i = 0; i < N; i++) { const v = arr[i]; if (num(v)) { if (v < lo) lo = v; if (v > hi) hi = v; } }
            if (!isFinite(lo)) return;
            if (hi - lo < 1e-6) { hi += 1; lo -= 1; }
            el.querySelector('.rng.hi').textContent = ch.fmt(hi);
            el.querySelector('.rng.lo').textContent = ch.fmt(lo);
            const y = v => h - 4 - (v - lo) / (hi - lo) * (h - 8);
            shadeGaps(ctx, w, h);
            ctx.beginPath();
            const step = Math.max(1, Math.floor(N / (w * 2)));
            let started = false;
            for (let i = 0; i < N; i += step) {
                const v = arr[i];
                if (!num(v)) { started = false; continue; }
                const px = axis[i] / span * w;
                if (!started) { ctx.moveTo(px, y(v)); started = true; } else ctx.lineTo(px, y(v));
            }
            ctx.strokeStyle = line;
            ctx.lineWidth = 1.5;
            ctx.lineJoin = 'round';
            ctx.stroke();
        });
    }

    function renderLaneValues() {
        lanes.querySelectorAll('[data-v]').forEach(el => {
            const ch = CHAN[el.dataset.v];
            const v = ch ? valueAt(S[el.dataset.v], cursorAxis) : null;
            el.textContent = v === null ? '—' : ch.fmt(v);
        });
    }

    function setPicked(next) {
        picked = next;
        store.set('channels', picked);
        buildLanes();
        renderPicker();
    }

    // ── Channel picker ───────────────────────────────────────────────────
    const picker = $('fv-picker'), chanBtn = $('fv-channels');
    $('fv-picker-title').textContent = (sim ? sim + ' channels' : 'Channels');
    function renderPicker() {
        $('fv-picker-body').innerHTML = CH.map(([name, items]) => `
            <div><div class="fv-group-name">${esc(name)}</div>
            ${items.map(([k, label]) => `<button type="button" class="fv-chan" data-chan="${k}" aria-pressed="${picked.includes(k)}"><span class="box" aria-hidden="true"></span>${esc(label)}</button>`).join('')}
            </div>`).join('') || '<div class="fv-muted" style="padding:8px">This flight has recorded no channels yet.</div>';
        picker.querySelectorAll('[data-chan]').forEach(b => b.addEventListener('click', () => {
            const k = b.dataset.chan;
            setPicked(picked.includes(k) ? picked.filter(x => x !== k) : picked.concat([k]));
        }));
    }
    function openPicker(open) {
        picker.hidden = !open;
        chanBtn.setAttribute('aria-expanded', open);
        chanBtn.classList.toggle('is-on', open);
        if (open) { const f = picker.querySelector('.fv-chan'); if (f) f.focus(); }
    }
    chanBtn.addEventListener('click', () => openPicker(picker.hidden));
    $('fv-lanes-pick').addEventListener('click', () => openPicker(true));
    $('fv-picker-close').addEventListener('click', () => { openPicker(false); chanBtn.focus(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !picker.hidden) { openPicker(false); chanBtn.focus(); } });
    document.addEventListener('pointerdown', e => {
        if (!picker.hidden && !picker.contains(e.target) && !chanBtn.contains(e.target) && !$('fv-lanes-pick').contains(e.target)) openPicker(false);
    });

    // ── Panels and tabs ──────────────────────────────────────────────────
    // Wide, three columns: the flight display on the left and the 3D view on
    // the right, both 4:3, with the altitude profile or the graphs between
    // them. Wide, two columns: when that middle would be narrower than 4:3,
    // the 3D view joins its tabs. Narrow: one panel, four tabs.
    const MTABS = ['altitude', 'horizon', '3d', 'graphs'];
    let mtab = MTABS.includes(store.get('mtab', 'altitude')) ? store.get('mtab', 'altitude') : 'altitude';
    const narrowMq = window.matchMedia('(max-width: 899px)');
    // What is on screen: read by the cursor handlers.
    const vis = { pfd: true, d3: true, lanes: false };
    const mBtns = Array.from(document.querySelectorAll('.fv-mtabs .fv-tab'));
    const strip = document.querySelector('.fv-strip');
    const COL_GAP = 12;
    function layoutNow() {
        if (narrowMq.matches) return 'phone';
        // The side panels are as tall as the window can spare, and 4:3.
        const bh = Math.round(Math.max(200, Math.min(300, window.innerHeight * 0.32)));
        strip.style.setProperty('--bh', bh + 'px');
        const cs = getComputedStyle(strip);
        const inner = strip.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
        const cw = bh * 4 / 3;
        return inner - 2 * cw - 2 * COL_GAP >= cw ? 'wide3' : 'wide2';
    }
    function applyTabs() {
        const layout = layoutNow();
        strip.dataset.layout = layout;
        const offered = layout === 'phone' ? MTABS
            : layout === 'wide2' ? ['altitude', '3d', 'graphs'] : ['altitude', 'graphs'];
        const cur = offered.includes(mtab) ? mtab : 'altitude';
        strip.dataset.mtab = cur;
        vis.pfd = layout !== 'phone' || cur === 'horizon';
        vis.d3 = layout === 'wide3' || cur === '3d';
        vis.lanes = cur === 'graphs';
        mBtns.forEach(b => {
            const on = b.dataset.mtab === cur;
            b.hidden = !offered.includes(b.dataset.mtab);
            b.setAttribute('aria-selected', on);
            b.tabIndex = on ? 0 : -1;
        });
        $('panel-instruments').hidden = !(vis.pfd || vis.d3);
        $('panel-graphs').hidden = !vis.lanes;
        chanBtn.hidden = !vis.lanes;
        if (chanBtn.hidden) openPicker(false);
        if (vis.pfd || vis.d3) H.onPaneShown('replay');
        if (vis.pfd) renderReadouts();
        if (vis.lanes) { drawLanes(); placeCursors(); renderLaneValues(); }
        // The profile just changed size or came back; the observer redraws it.
    }
    mBtns.forEach(b => b.addEventListener('click', () => {
        mtab = b.dataset.mtab; store.set('mtab', mtab); applyTabs();
    }));
    mBtns.forEach(b => b.addEventListener('keydown', e => {
        if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
        e.preventDefault(); e.stopPropagation();
        const shown = mBtns.filter(x => !x.hidden);
        const i = (shown.indexOf(b) + (e.key === 'ArrowRight' ? 1 : shown.length - 1)) % shown.length;
        shown[i].focus(); shown[i].click();
    }));
    (narrowMq.addEventListener ? narrowMq.addEventListener.bind(narrowMq, 'change') : narrowMq.addListener.bind(narrowMq))(applyTabs);
    let layoutT = null;
    window.addEventListener('resize', () => { clearTimeout(layoutT); layoutT = setTimeout(applyTabs, 100); });

    // Cockpit, HUD (the cockpit camera with the flight display's numbers
    // drawn over it) or chase.
    const camBtns = Array.from(document.querySelectorAll('[data-cam]'));
    const hud = window.createHUD ? createHUD(document.querySelector('.fv-3d')) : null;
    let cam = 'cockpit';
    function setCam(m) {
        cam = m;
        camBtns.forEach(b => { const on = b.dataset.cam === m; b.classList.toggle('is-on', on); b.setAttribute('aria-pressed', on); });
        H.setCockpitMode(m === 'chase' ? 'chase' : 'cockpit');
        if (hud) hud.show(m === 'hud');
        store.set('cam', m);
    }
    function feedHud(r) { if (hud) hud.update(r); }
    camBtns.forEach(b => b.addEventListener('click', () => setCam(b.dataset.cam)));
    $('fv-3d-full').addEventListener('click', () => {
        const el = document.querySelector('.fv-3d');
        if (document.fullscreenElement) document.exitFullscreen();
        else if (el.requestFullscreen) el.requestFullscreen();
    });

    // ── Readouts ─────────────────────────────────────────────────────────
    let cursorAxis = 0, lastSample = null;
    function renderReadouts() {
        const s = lastSample;
        if (!s || !vis.pfd) return;
        const at = k => H.hasData(k) ? valueAt(S[k], cursorAxis) : null;
        const rows = [];
        if (num(s.groundSpeed)) rows.push(['Ground speed', Math.round(s.groundSpeed) + ' kt']);
        else if (num(s.ias)) rows.push(['Airspeed', Math.round(s.ias) + ' kt']);
        if (num(s.vspeed)) rows.push(['Vertical speed', FMT.vs.fmt(s.vspeed)]);
        const t = terrainAt(cursorAxis);
        if (t !== null && num(s.altitude)) rows.push(['Above terrain', group(Math.max(0, s.altitude - t)) + ' ft']);
        else if (num(s.altitude)) rows.push(['Altitude', group(s.altitude) + ' ft']);
        const ws = at('wind_speed'), wd = at('wind_dir');
        if (ws !== null && wd !== null) rows.push(['Wind', deg(wd) + ' / ' + Math.round(ws) + ' kt']);
        const pw = at('pct_power');
        if (pw !== null) rows.push(['Power', Math.round(pw) + ' %']);
        const oat = at('oat');
        if (oat !== null) rows.push(['Outside air', FMT.oat.fmt(oat)]);
        const ff = at('fuel_flow');
        if (ff !== null) rows.push(['Fuel flow', FMT.fuel_flow.fmt(ff)]);
        $('fv-readouts').innerHTML = rows.slice(0, 5).map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('');
    }

    function placeCursors() {
        const left = toPct(cursorAxis).toFixed(3) + '%';
        document.querySelectorAll('.fv-plot .fv-cursor').forEach(c => { c.style.left = left; });
    }

    function elapsedText(epoch) {
        const takeoff = evOf('takeoff')[0];
        const toEpoch = parseTs(takeoff && takeoff.timestamp);
        const ref = toEpoch !== null ? toEpoch : T().ts[0];
        const d = Math.round((epoch - ref) / 60), a = Math.abs(d);
        const t = a >= 60 ? Math.floor(a / 60) + 'h ' + (a % 60) + 'm' : a + 'm';
        if (toEpoch === null) return mode === 'live' ? t + ' since the log started' : t + ' into the log';
        if (mode === 'live' && d >= 0 && !evOf('landing').length) return t + ' airborne';
        return d >= 0 ? t + ' after takeoff' : t + ' before takeoff';
    }

    let lastClockSec = -1;
    function setClock(epoch) {
        const sec = Math.floor(epoch);
        // Text changes at most once a second of flight; layout is the cost.
        if (sec === lastClockSec) return;
        lastClockSec = sec;
        $('fv-clock').textContent = new Date(sec * 1000).toISOString().slice(11, 19) + ' UTC';
        $('fv-elapsed').textContent = elapsedText(epoch);
        $('fv-profile').setAttribute('aria-valuetext', $('fv-clock').textContent);
    }

    // ── Scrubbing: press anywhere on the profile or a lane and drag ──────
    function wireScrub(el) {
        let down = false;
        const seekTo = e => {
            if (mode !== 'replay') return;
            const r = el.getBoundingClientRect();
            FlightReplay.seek(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)));
        };
        el.addEventListener('pointerdown', e => {
            if (mode !== 'replay' || e.target.closest('button')) return;
            down = true; el.setPointerCapture(e.pointerId); seekTo(e);
        });
        el.addEventListener('pointermove', e => { if (down) seekTo(e); });
        el.addEventListener('pointerup', () => { down = false; });
        el.addEventListener('pointercancel', () => { down = false; });
    }
    wireScrub($('fv-profile'));
    $('fv-events').addEventListener('click', e => {
        const b = e.target.closest('.fv-shot');
        if (!b || typeof openLb !== 'function') return;
        window._lbUrls = (S.screenshots || []).map(s => s.url);
        openLb(+b.dataset.shot);
    });

    // ── Live: pinned to now ──────────────────────────────────────────────
    function applyMode() {
        const live = mode === 'live';
        $('fv-play').hidden = live;
        $('fv-speeds').hidden = live;
        $('fv-live').hidden = !live;
        document.querySelector('.fv-strip').classList.toggle('is-live', live);
        $('fv-profile').setAttribute('aria-label', live
            ? 'Flight so far: altitude over the terrain below'
            : 'Flight timeline: altitude over the terrain below');
    }

    function followNow(doc) {
        const { ts, N, span } = T();
        cursorAxis = span;
        const c = doc && doc.current;
        if (c) {
            lastSample = { groundSpeed: c.speed, ias: c.ias, vspeed: c.verticalSpeed, altitude: c.altitude };
            feedHud({ pitch: c.pitch, roll: c.roll, ias: num(c.ias) ? c.ias : c.speed,
                      altitude: num(c.indicatedAltitude) ? c.indicatedAltitude : c.altitude,
                      heading: num(c.magneticHeading) ? c.magneticHeading : c.heading,
                      vs: c.verticalSpeed, gs: c.speed });
        } else if (N) {
            const i = N - 1;
            lastSample = { groundSpeed: S.ground_speed[i], ias: S.ias[i], vspeed: S.vs[i], altitude: S.alts[i] };
        }
        // The newest sample's time, so the clock agrees with the end of the
        // profile it sits above.
        if (N) setClock(ts[N - 1]);
        placeCursors();
        renderReadouts();
        renderLaneValues();
    }

    // ── Replay ───────────────────────────────────────────────────────────
    const SPEEDS = [1, 10, 30, 100, 300];
    let speed = 30, subscribed = false;
    function renderSpeeds() {
        $('fv-speeds').innerHTML = SPEEDS.map(v =>
            `<button type="button" data-speed="${v}" class="${v === speed ? 'is-on' : ''}" aria-pressed="${v === speed}">${v}×</button>`).join('');
        $('fv-speeds').querySelectorAll('[data-speed]').forEach(b => b.addEventListener('click', () => {
            speed = +b.dataset.speed; FlightReplay.setRate(speed); renderSpeeds();
        }));
    }
    const playBtn = $('fv-play');
    playBtn.addEventListener('click', () => { if (mode === 'replay') FlightReplay.toggle(); });

    function toReplay() {
        if (typeof FlightReplay === 'undefined' || !FlightReplay.ready()) return false;
        mode = 'replay';
        applyMode();
        const auto = FlightReplay.autoRate();
        speed = SPEEDS.reduce((a, b) => Math.abs(Math.log(b / auto)) < Math.abs(Math.log(a / auto)) ? b : a);
        renderSpeeds();
        FlightReplay.setRate(speed);
        if (!subscribed) {
            subscribed = true;
            FlightReplay.subscribe(ev => {
                if (mode !== 'replay') return;
                cursorAxis = ev.axis;
                lastSample = ev.sample;
                const s = ev.sample;
                // Magnetic once the sim's variation is off, as on the flight display.
                feedHud({ pitch: s.pitch, roll: s.roll, ias: s.ias, altitude: s.altitude,
                          heading: num(s.heading) ? s.heading - (s.magvar || 0) : s.track,
                          vs: s.vspeed, gs: s.groundSpeed });
                placeCursors();
                $('fv-profile').setAttribute('aria-valuenow', Math.round(ev.progress * 100));
                playBtn.dataset.state = ev.playing ? 'playing' : ev.atEnd ? 'end' : 'paused';
                playBtn.setAttribute('aria-label', ev.playing ? 'Pause replay' : 'Play replay');
                setClock(ev.sample.epoch);
                if (vis.pfd) renderReadouts();
                if (vis.lanes) renderLaneValues();
            });
        }
        sync3dAvailable();
        renderEvents();
        return true;
    }

    // ── Sizes ────────────────────────────────────────────────────────────
    let redrawT = null;
    const ro = new ResizeObserver(() => {
        if (S.map) S.map.invalidateSize();
        clearTimeout(redrawT);
        redrawT = setTimeout(() => { drawProfile(); drawLanes(); renderEvents(); }, 80);
    });
    ro.observe($('fv-map'));
    ro.observe($('fv-profile'));

    // ── Start ────────────────────────────────────────────────────────────
    renderHeader();
    renderPicker();
    buildLanes();
    drawProfile();
    renderEvents();
    loadTerrain();
    applyTabs();
    setCam(['chase', 'hud'].includes(store.get('cam', 'cockpit')) ? store.get('cam', 'cockpit') : 'cockpit');
    sync3dAvailable();
    applyMode();
    if (mode === 'replay' && !toReplay()) {
        // Too short to replay (or no track at all): the map is the page.
        document.querySelector('.fv-strip').hidden = true;
    }

    return {
        /// After a live poll has been rendered: redraw what grew.
        update(doc) {
            if (refreshChannels()) { renderPicker(); buildLanes(); }
            renderHeader();
            drawProfile();
            drawLanes();
            renderEvents();
            // Re-sample the ground once the track has grown by a fifth, so a
            // long flight does not refetch on every poll.
            if (T().N > terrain.n * 1.2 + 5) loadTerrain();
            if (mode === 'live') followNow(doc);
        },
        toReplay,
    };
};
</script>
