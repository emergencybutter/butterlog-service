<!-- Layout for the one-screen flight view (flight_view.html): the map fills
     the window above a bottom strip of timeline, instruments and graphs.
     Data-viz colours (altitude teal, terrain olive, cursor amber) follow the
     3D path's palette so the views read as one. -->
<style>
    .fv-page .view-head-inner { max-width: none; }
    .fv-head { height: 60px; padding-top: 6px; padding-bottom: 6px; }
    .fv-head .view-head-inner { flex-wrap: wrap; row-gap: 6px; }
    .fv-id { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
    .fv-route { font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; letter-spacing: -0.01em; color: var(--text); }
    .fv-meta { font-size: 0.82rem; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fv-grade { font-size: 0.82rem; font-weight: 600; font-variant-numeric: tabular-nums; padding: 4px 10px; border-radius: var(--radius-sm); }
    .fv-grade.g-butter, .fv-grade.g-smooth { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
    .fv-grade.g-firm { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
    .fv-grade.g-hard { color: var(--error); background: color-mix(in srgb, var(--error) 14%, transparent); }

    .fv-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 14px;
              border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: transparent;
              color: var(--text); font-family: var(--font-body); font-size: 0.875rem; font-weight: 600;
              text-decoration: none; cursor: pointer; white-space: nowrap; }
    .fv-btn:hover { border-color: var(--accent); color: var(--accent-text); }
    .fv-btn svg { width: 14px; height: 14px; }
    .fv-btn-sm { min-height: 32px; padding: 0 12px; font-size: 0.82rem; }
    .fv-btn-quiet { border-color: transparent; color: var(--text-muted); }
    .fv-btn.is-on { background: var(--accent-weak); color: var(--accent-text); border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
    .fv-icon { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; padding: 0;
               border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--text); cursor: pointer; font-size: 15px; }
    .fv-icon:hover { color: var(--accent-text); }
    .fv-icon svg { width: 16px; height: 16px; }
    .fv-seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); overflow: hidden; flex: none; }
    .fv-seg button { border: 0; background: transparent; color: var(--text-2); font-family: var(--font-body);
                     font-size: 0.82rem; font-weight: 600; font-variant-numeric: tabular-nums; padding: 0 11px; min-height: 32px; cursor: pointer; }
    .fv-seg button + button { border-left: 1px solid var(--border-strong); }
    .fv-seg button:hover { color: var(--text); }
    .fv-seg button.is-on { background: var(--accent-weak); color: var(--accent-text); }
    .fv-float { background: color-mix(in srgb, var(--surface) 94%, transparent); border: 1px solid var(--border-strong);
                border-radius: var(--radius); box-shadow: var(--shadow); }
    .fv-muted { font-size: 0.82rem; color: var(--text-muted); }
    .fv-spacer { flex: 1; }
    :is(.fv-btn, .fv-icon, .fv-seg button, .fv-tab, .fv-play, .fv-chan):focus-visible,
    .fv-plot:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ── Live ─────────────────────────────────────────────────────────── */
    .fv-head .live-meta { font-size: 0.82rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .fv-live { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 999px;
               background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); font-size: 0.875rem; font-weight: 600; }
    .fv-live[hidden], .fv-play[hidden], .fv-seg[hidden] { display: none; }
    .fv-live .live-dot { background: var(--ok); animation: none; }
    .fv-strip.is-live .fv-plot { cursor: default; }
    .fv-seg button:disabled { opacity: 0.45; cursor: not-allowed; }
    .fv-simctl { position: absolute; right: 16px; top: calc(100% + 6px); z-index: 900; width: min(440px, calc(100vw - 32px));
                 max-height: 70vh; overflow-y: auto; }
    .fv-simctl[hidden] { display: none; }
    .fv-simctl .ctl-card { margin: 0; border: 0; background: transparent; }
    .fv-head .view-head-inner { position: relative; }

    /* ── Frame: the map takes what the strip leaves ───────────────────── */
    .fv { display: flex; flex-direction: column; height: calc(100vh - 60px); height: calc(100dvh - 60px); min-height: 640px; }
    /* isolation keeps Leaflet's pane z-indexes (400-1000) inside the map, so
       the header's panels and the menu drawer can sit over it. */
    .fv-map { position: relative; isolation: isolate; flex: 1 1 auto; min-height: 240px; background: var(--surface); overflow: hidden; }
    .fv-map #map, .fv-map #map3d-section, .fv-map #map3d { position: absolute; inset: 0; height: auto; margin: 0; border: 0; border-radius: 0; }
    /* Above Leaflet's panes (z-index 400), below the map controls. */
    .fv-map #map3d-section { z-index: 450; }
    .fv-map #map3d-section[hidden], .fv-map .m3d-play[hidden] { display: none !important; }
    .fv-map.is-3d .leaflet-control-container { display: none; }
    .fv-mapctl { position: absolute; right: 12px; top: 12px; z-index: 500; display: flex; align-items: center; gap: 4px; padding: 4px; }
    .fv-map .m3d-controls { top: 64px; }
    .plane-tip { font-family: var(--font-body); font-variant-numeric: tabular-nums; font-size: 0.82rem; font-weight: 600;
                 background: color-mix(in srgb, var(--surface) 94%, transparent); color: var(--text);
                 border: 1px solid var(--border-strong); border-radius: var(--radius-sm); box-shadow: var(--shadow); }
    .plane-tip::before { display: none; }

    .fv-strip { flex: none; border-top: 1px solid var(--border); background: var(--surface);
                padding: 8px 16px 12px; display: flex; flex-direction: column; gap: 8px; }
    .fv-transport { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; }
    .fv-play { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 999px;
               border: 0; background: var(--accent); color: var(--on-accent); cursor: pointer; flex: none; }
    .fv-play:hover { background: var(--accent-hover); }
    .fv-play svg { width: 15px; height: 15px; display: none; }
    .fv-play[data-state="paused"] .i-play, .fv-play[data-state="playing"] .i-pause, .fv-play[data-state="end"] .i-again { display: block; }
    .fv-clock { font-size: 0.95rem; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text); }
    .fv-elapsed { font-size: 0.82rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .fv-key { display: inline-flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--text-muted); }
    .fv-key[hidden] { display: none; }
    .fv-key-line { width: 14px; height: 3px; background: #33b8a1; border-radius: 2px; }
    .fv-key-fill { width: 14px; height: 10px; background: #4a5641; border-radius: 2px; }

    /* Label column + plot: the profile and every lane share it, so one x is
       one moment all the way down. */
    .fv-grid { display: grid; grid-template-columns: 124px minmax(0, 1fr); column-gap: 12px; row-gap: 4px; }
    .fv-axis { display: flex; flex-direction: column; justify-content: space-between; text-align: right; height: 84px;
               font-size: 0.78rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .fv-plot { position: relative; border-radius: var(--radius-sm); background: var(--bg); overflow: hidden; cursor: ew-resize; touch-action: none; }
    .fv-plot canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .fv-profile { height: 84px; }
    .fv-cursor { position: absolute; top: 0; bottom: 0; left: 0; width: 2px; margin-left: -1px; background: var(--accent);
                 pointer-events: none; will-change: transform; }
    .fv-events span { position: absolute; top: 3px; font-size: 0.75rem; color: var(--text-muted); white-space: nowrap;
                      pointer-events: none; padding-left: 4px; border-left: 1px dashed color-mix(in srgb, var(--text-muted) 60%, transparent); line-height: 1.3; }
    .fv-events span.lo { top: 19px; }
    /* Screenshot marks along the bottom of the profile; they open the screenshot. */
    .fv-events .fv-shot { position: absolute; bottom: 2px; width: 20px; height: 20px; margin-left: -10px; padding: 3px;
                          border: 0; border-radius: 50%; background: var(--surface); color: var(--accent-text);
                          cursor: pointer; display: grid; place-items: center; box-shadow: 0 0 0 1px var(--border-strong); }
    .fv-events .fv-shot:hover { color: var(--text); box-shadow: 0 0 0 1px var(--accent); }
    .fv-events .fv-shot svg { width: 14px; height: 14px; pointer-events: none; }
    .fv-events .fv-shot .n { position: absolute; top: -7px; right: -8px; min-width: 14px; height: 14px; padding: 0 3px; border-radius: 7px;
                             background: var(--accent); color: var(--bg); font: 700 0.62rem/14px var(--font-body); pointer-events: none; }
    /* The pilot's notes and screenshots, over the map's bottom-left corner. */
    .fv-memo { position: absolute; left: 12px; bottom: 24px; z-index: 500; width: min(340px, calc(100% - 24px));
               padding: 6px 10px 8px; }
    .fv-memo[hidden], .fv-map.is-3d .fv-memo { display: none; }
    .fv-memo-tab { display: flex; align-items: center; gap: 6px; width: 100%; border: 0; background: none; padding: 2px 0;
                   color: var(--text-muted); font: 600 0.75rem var(--font-body); text-transform: uppercase; letter-spacing: 0.04em; cursor: pointer; }
    .fv-memo-tab:hover { color: var(--text); }
    .fv-memo-chev { margin-left: auto; width: 7px; height: 7px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
                    transform: rotate(45deg) translate(-2px, -2px); }
    .fv-memo.is-shut { width: auto; padding-bottom: 6px; }
    .fv-memo.is-shut .fv-memo-chev { transform: rotate(-135deg) translate(-1px, -1px); }
    .fv-memo.is-shut .fv-memo-body { display: none; }
    .fv-memo-notes { margin-top: 4px; color: var(--text); font-size: 0.9rem; line-height: 1.4; white-space: pre-wrap; cursor: pointer;
                     display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .fv-memo-notes.is-open { -webkit-line-clamp: unset; display: block; max-height: 30vh; overflow-y: auto; }
    .fv-memo-shots { display: flex; gap: 6px; margin-top: 6px; overflow-x: auto; scrollbar-width: thin; }
    .fv-memo-shots img { width: 72px; height: 45px; object-fit: cover; flex: none; border-radius: var(--radius-sm);
                         border: 1px solid var(--border-strong); cursor: pointer; }
    .fv-memo-shots img:hover { border-color: var(--accent); }
    .fv-events span.is-end { transform: translateX(-100%); padding-left: 0; padding-right: 4px; border-left: 0;
                             border-right: 1px dashed color-mix(in srgb, var(--text-muted) 60%, transparent); }
    .fv-events span.g-hard { color: var(--error); font-weight: 600; }
    .fv-events span.g-firm { color: var(--warn); font-weight: 600; }
    .fv-events span.g-butter, .fv-events span.g-smooth { color: var(--ok); font-weight: 600; }

    /* ── Tabs and the panel under them ────────────────────────────────── */
    .fv-tabsrow { position: relative; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); }
    .fv-tab { display: inline-flex; align-items: center; gap: 7px; min-height: 40px; padding: 0 2px; border: 0; background: transparent;
              color: var(--text-muted); font-family: var(--font-body); font-size: 0.9rem; font-weight: 600; cursor: pointer; }
    .fv-tab svg { width: 16px; height: 16px; }
    .fv-tab:hover { color: var(--text); }
    .fv-tab[aria-selected="true"] { color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); }
    .fv-count { font-size: 0.78rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .fv-tabsrow [hidden], .fv-mtabs .fv-tab[hidden] { display: none !important; }

    .fv-panel { height: 220px; }
    .fv-panel[hidden] { display: none; }
    #panel-instruments { display: flex; gap: 12px; }
    #panel-instruments[hidden] { display: none; }
    .fv-pfd { flex: none; height: 100%; aspect-ratio: 16 / 10; background: #05070a; border-radius: var(--radius-sm); overflow: hidden;
              display: flex; align-items: center; justify-content: center; }
    .fv-pfd .pfd { margin: 0; padding: 0; border: 0; border-radius: 0; width: 100%; background: transparent; }
    .fv-3d { position: relative; flex: 1 1 auto; min-width: 0; border-radius: var(--radius-sm); overflow: hidden; }
    .fv-3d #cockpit { position: absolute; inset: 0; height: auto; margin: 0; border: 0; border-radius: 0; }
    /* The camera switch sits on the view it controls. */
    .fv-3d-cam { position: absolute; left: 10px; top: 10px; z-index: 1; }
    .fv-3d-full { position: absolute; right: 10px; top: 10px; z-index: 1; width: 34px; height: 34px; }
    .fv-3d:fullscreen { border-radius: 0; }
    .fv-readouts { flex: none; width: 200px; margin: 0; display: flex; flex-direction: column; justify-content: center; }
    .fv-readouts div { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border); }
    .fv-readouts div:last-child { border-bottom: 0; }
    .fv-readouts dt { font-size: 0.82rem; color: var(--text-muted); }
    .fv-readouts dd { margin: 0; font-size: 0.9rem; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text); white-space: nowrap; }

    .fv-lanes { overflow-y: auto; }
    .fv-lane-lbl { display: flex; flex-direction: column; justify-content: center; align-items: flex-end; gap: 1px; height: 48px; text-align: right; min-width: 0; }
    .fv-lane-lbl .n { font-size: 0.78rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .fv-lane-lbl .v { font-size: 0.875rem; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text); white-space: nowrap; }
    .fv-lane { height: 48px; }
    .fv-lane .rng { position: absolute; left: 4px; padding: 0 4px; border-radius: 3px; background: color-mix(in srgb, var(--bg) 85%, transparent);
                  font-size: 0.72rem; color: var(--text-muted); font-variant-numeric: tabular-nums; pointer-events: none; }
    .fv-lane .rng.hi { top: 3px; } .fv-lane .rng.lo { bottom: 3px; }
    .fv-lane .x { position: absolute; right: 2px; top: 2px; width: 28px; height: 28px; border: 0; background: transparent;
                  color: var(--text-muted); cursor: pointer; font-size: 13px; border-radius: var(--radius-sm);
                  background: color-mix(in srgb, var(--bg) 85%, transparent); }
    .fv-lane .x:hover { color: var(--text); background: var(--surface-2); }
    .fv-empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; }
    .fv-empty[hidden] { display: none; }

    .fv-picker { position: absolute; right: 0; bottom: calc(100% + 8px); z-index: 800; width: min(540px, calc(100vw - 32px));
                 max-height: min(460px, 60vh); overflow-y: auto; }
    .fv-picker-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 14px 14px 6px 16px; }
    .fv-picker-title { font-size: 0.95rem; font-weight: 700; color: var(--text); margin-bottom: 3px; }
    .fv-picker-body { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px; padding: 4px 8px 12px; }
    .fv-group-name { padding: 8px 10px 2px; font-size: 0.78rem; font-weight: 600; color: var(--teal-text); }
    .fv-chan { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 34px; padding: 0 10px; border: 0; border-radius: var(--radius-sm);
               background: transparent; color: var(--text-2); font-family: var(--font-body); font-size: 0.875rem; text-align: left; cursor: pointer; }
    .fv-chan:hover { background: var(--surface-2); color: var(--text); }
    .fv-chan .box { width: 14px; height: 14px; border-radius: 3px; border: 1.5px solid var(--border-strong); flex: none; }
    .fv-chan[aria-pressed="true"] { color: var(--text); }
    .fv-chan[aria-pressed="true"] .box { background: var(--teal); border-color: var(--teal); }

    /* ── Wide: flight display | altitude or graphs | 3D view ──────────── */
    /* --bh (the side panels' height) is set by the script from the window
       height; the side columns are 4:3 at that height. When the middle would
       be narrower than that, the script picks wide2 and the 3D view becomes
       one of the middle's tabs. Rows: transport, tabs, body, readouts. */
    .fv-strip[data-layout^="wide"] {
        --bh: 280px; --cw: calc(var(--bh) * 4 / 3);
        display: grid; column-gap: 12px; row-gap: 8px;
        grid-template-columns: var(--cw) minmax(0, 1fr) var(--cw);
        grid-template-rows: auto 40px calc(var(--bh) - 100px) 44px;
    }
    .fv-strip[data-layout="wide2"] { grid-template-columns: var(--cw) minmax(0, 1fr); }
    .fv-strip[data-layout^="wide"] > .fv-transport { grid-column: 1 / -1; grid-row: 1; }
    .fv-strip[data-layout^="wide"] > .fv-mtabs { display: flex; gap: 18px; grid-column: 2; grid-row: 2; border-bottom: 1px solid var(--border); }
    .fv-strip[data-layout^="wide"] > .fv-tabsrow { grid-column: 2; grid-row: 2; justify-self: end; align-self: center; border-bottom: 0; }
    .fv-strip[data-layout^="wide"] > .fv-grid { grid-column: 2; grid-row: 3; grid-template-columns: 64px minmax(0, 1fr); column-gap: 8px; }
    .fv-strip[data-layout^="wide"] .fv-profile,
    .fv-strip[data-layout^="wide"] .fv-axis { height: calc(var(--bh) - 100px); }
    .fv-strip[data-layout^="wide"]:not([data-mtab="altitude"]) > .fv-grid { display: none; }
    .fv-strip[data-layout^="wide"] > #panel-instruments:not([hidden]) { display: contents; }
    .fv-strip[data-layout^="wide"] .fv-pfd { grid-column: 1; grid-row: 2 / 5; height: auto; aspect-ratio: 4 / 3; }
    .fv-strip[data-layout="wide3"] .fv-3d { grid-column: 3; grid-row: 2 / 5; }
    .fv-strip[data-layout="wide2"] .fv-3d { grid-column: 2; grid-row: 3 / 5; }
    .fv-strip[data-layout="wide2"]:not([data-mtab="3d"]) .fv-3d { display: none; }
    /* The numbers sit in a row under the profile; the graph lanes carry
       their own, and the 3D view takes the row in the two-column layout. */
    .fv-strip[data-layout^="wide"] .fv-readouts { grid-column: 2; grid-row: 4; width: auto; flex-direction: row; align-items: center; gap: 28px; overflow: hidden; }
    .fv-strip[data-layout^="wide"] .fv-readouts div { flex-direction: column; align-items: flex-start; gap: 1px; padding: 0; border: 0; }
    .fv-strip[data-layout^="wide"]:not([data-mtab="altitude"]) .fv-readouts { display: none; }
    .fv-strip[data-layout^="wide"] > #panel-graphs { grid-column: 2; grid-row: 3 / 5; height: auto; min-height: 0; }

    /* ── Details dialog: what the Summary tab used to be ──────────────── */
    .fv-details { margin: auto; width: min(860px, calc(100vw - 32px)); max-height: calc(100vh - 64px); padding: 0; border: 1px solid var(--border-strong);
                  border-radius: var(--radius); background: var(--bg); color: var(--text); box-shadow: var(--shadow); }
    .fv-details::backdrop { background: rgba(0,0,0,0.55); }
    .fv-details-head { position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: center;
                       padding: 10px 12px 10px 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
    .fv-details-title { font-weight: 700; }
    .fv-details-body { padding: 20px; }

    /* ── Narrow: the page scrolls, the panel stacks ───────────────────── */
    .fv-mtabs { display: none; }
    .fv-menu { display: none; }

    @media (max-width: 899px) {
        .fv { height: auto; min-height: 0; }
        .fv-map { flex: none; height: 40vh; min-height: 220px; }
        /* The top bar only holds the menu button here; the flight header
           carries that button instead, so the map gets the bar's 52px. */
        .fv-page .topbar { display: none; }
        .fv-page .fv-menu { display: inline-flex; flex: none; }
        .fv-head { top: 0; height: auto; min-height: 60px; }
        /* Route and info line take the first row; the chips and buttons wrap under. */
        .fv-id { flex: 1 1 220px; }
        .fv-route { white-space: nowrap; }
        .fv-strip { padding: 8px 12px 16px; --mh: 280px; }
        .fv-key { display: none; }
        .fv-picker-body { grid-template-columns: 1fr; }

        /* One panel, four tabs (Altitude, Horizon, 3D view, Graphs). The
           desktop tab row keeps only the control for the open tab. */
        .fv-strip > .fv-transport { order: 1; }
        .fv-mtabs { order: 2; display: flex; gap: 16px; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
        .fv-mtabs .fv-tab { flex: none; }
        .fv-strip > .fv-grid { order: 3; }
        .fv-tabsrow { order: 4; border-bottom: 0; justify-content: flex-end; }
        /* The altitude profile only shows on its own tab; the other tabs get
           its height (the profile is var(--mh) + 36px), less the row the graph
           tab spends on its Channels button, so every tab fills the same area. */
        .fv-strip > .fv-panel { order: 5; height: calc(var(--mh) + 36px); }
        .fv-strip[data-mtab="graphs"] > .fv-panel { height: calc(var(--mh) - 6px); }
        .fv-tabsrow { min-height: 34px; }
        .fv-strip:not([data-mtab="graphs"]) .fv-tabsrow { display: none; }

        /* Altitude: the profile is the panel. */
        .fv-strip > .fv-grid { grid-template-columns: 56px minmax(0, 1fr); column-gap: 8px; }
        .fv-strip[data-mtab="altitude"] .fv-profile,
        .fv-strip[data-mtab="altitude"] .fv-axis { height: calc(var(--mh) + 36px); }
        .fv-strip:not([data-mtab="altitude"]) > .fv-grid { display: none; }
        .fv-lanes .fv-grid { grid-template-columns: 96px minmax(0, 1fr); column-gap: 8px; }

        /* Horizon: the flight display with the numbers under it. */
