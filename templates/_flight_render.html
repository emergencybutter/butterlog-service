<script>
// Shared renderer for a flight document (the app's FlightDetailShare shape).
// Used by both the share page, which gets one static document, and the live
// page, which gets the same shape from /api/v0/flights/:id/live and then feeds
// it deltas. Keeping one implementation is why the live read model was built to
// emit the share's shape in the first place.
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function reconstructTs(deltas) {
    if (!deltas || !deltas.length) return [];
    const ts = [deltas[0]];
    for (let i = 1; i < deltas.length; i++) ts.push(ts[i-1] + deltas[i]);
    return ts;
}
function fmtDur(m) { const h = Math.floor(m/60); return h > 0 ? h+'h '+(m%60)+'m' : m+'m'; }
function fmtDate(s) {
    if (!s) return '';
    try { return new Date(s.replace(' ','T')+'Z').toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short',timeZone:'UTC'}); } catch { return s; }
}

// Renders the document and returns a handle the live page uses to keep it
// current without tearing the page down on every poll.
function renderFlightDoc(d) {
    const td = d.transposedData || d.transposed_data || {};
    // The track carries attitude exactly as the sim reported it, and the two
    // sims disagree: MSFS is positive nose-down and positive left-wing-down,
    // X-Plane's theta/phi are already nose-up and right-wing-down. Normalise
    // once here, so the pitch chart and the flight display cannot disagree.
    // Same rule as `extract_current` in live.rs, including treating an unknown
    // simulator as MSFS.
    const attSign = /x-?plane/i.test(d.simulator || '') ? 1 : -1;
    const att = arr => (arr || []).map(v => v * attSign);
    const state = {
        timestamps: reconstructTs(td.timestamps),
        lats: (td.latitudes || []).slice(),
        lons: (td.longitudes || []).slice(),
        alts: (td.altitudes || []).slice(),
        ias: (td.ias || []).slice(),
        vs: (td.vspeed || []).slice(),
        pitch: att(td.pitch),
        roll: att(td.roll),
        // Everything the client uploads per sample. A flight that predates a
        // column, or a sim that does not provide it, leaves the array empty and
        // its chart is simply not drawn.
        heading: (td.heading || []).slice(),
        track: (td.track || []).slice(),
        ground_speed: (td.ground_speed || []).slice(),
        true_airspeed: (td.true_airspeed || []).slice(),
        baro: (td.baro || []).slice(),
        magvar: (td.magvar || []).slice(),
        g_load: (td.g_load || []).slice(),
        oat: (td.oat || []).slice(),
        wind_speed: (td.wind_speed || []).slice(),
        wind_dir: (td.wind_dir || []).slice(),
        fuel_flow: (td.fuel_flow || []).slice(),
        fuel_left: (td.fuel_left || []).slice(),
        fuel_right: (td.fuel_right || []).slice(),
        rpm: (td.rpm || []).slice(),
        pct_power: (td.pct_power || []).slice(),
        manifold: (td.manifold || []).slice(),
        oil_temp: (td.oil_temp || []).slice(),
        oil_press: (td.oil_press || []).slice(),
        summary: d.summary || {},
        screenshots: d.screenshots || [],
        map: null, path: null, planeMarker: null, touchdownMap: null, charts: [], chartKeys: [], cursors: [], userMoved: false,
    };

    function headerHtml() {
        const sum = state.summary;
        const dep = sum.startIcao || sum.departure || '?';
        const arr = sum.endIcao || sum.arrival || '?';
        const ac = sum.aircraftTitle || sum.airframe_name || '';
        const rIcao = (sum.resolvedIcao || sum.resolved_icao || '').trim();
        const rAirline = (sum.resolvedAirline || sum.resolved_airline || '').trim();
        const deducedHtml = (rIcao || rAirline)
            ? `<div class="meta">Deduced: ${esc([rIcao, rAirline].filter(Boolean).join(' · '))}</div>`
            : '';
        const dur = sum.durationMinutes || sum.duration_minutes || 0;
        const maxAlt = (sum.maxAltitude || sum.max_altitude || 0).toFixed(0);
        const maxGs = (sum.maxGroundSpeed || sum.max_ground_speed || 0).toFixed(0);
        const fuel = (sum.fuelConsumed || sum.fuel_consumed || 0).toFixed(1);
        const events = sum.events || [];
        const lEvt = events.filter(e => (e.eventType||e.event_type) === 'landing').pop();
        const lvs = lEvt && (lEvt.touchdownFpm || lEvt.touchdown_fpm);
        let badgeHtml = '';
        if (lvs != null) {
            const a = Math.abs(lvs);
            const [cls, lbl] = a < 150 ? ['butter','BUTTER'] : a < 250 ? ['smooth','SMOOTH'] : a < 350 ? ['firm','FIRM'] : ['hard','HARD'];
            badgeHtml = `<div class="badge badge-${cls}">${lbl} — ${Math.round(a)} fpm</div>`;
        }
        const notesText = (sum.notes || '').trim();
        const notesHtml = notesText ? `<div class="landing-card"><div class="section-title">Notes</div><div style="white-space:pre-wrap;line-height:1.5;color:var(--text)">${esc(notesText)}</div></div>` : '';
        return `
        <div style="margin-bottom:1.25rem">
            <div class="aircraft">${esc(ac)}</div>
            ${deducedHtml}
            <div class="meta">${fmtDate(sum.startTime||sum.start_time)} · ${fmtDur(dur)}</div>
            ${badgeHtml}
        </div>
        ${notesHtml}`;
    }

    /// The flight's headline figures. On the Summary tab rather than the
    /// always-on header, so Maps and Graphs open straight onto the thing they
    /// are named for instead of a screenful of numbers first.
    function statsHtml() {
        const sum = state.summary;
        const dur = sum.durationMinutes || sum.duration_minutes || 0;
        return `<div class="stats-grid">
            <div class="stat-card"><div class="stat-label">Max Altitude</div><div class="stat-value">${(sum.maxAltitude || sum.max_altitude || 0).toFixed(0)} ft</div></div>
            <div class="stat-card"><div class="stat-label">Max Speed (GS)</div><div class="stat-value">${(sum.maxGroundSpeed || sum.max_ground_speed || 0).toFixed(0)} kt</div></div>
            <div class="stat-card"><div class="stat-label">Fuel Consumed</div><div class="stat-value">${(sum.fuelConsumed || sum.fuel_consumed || 0).toFixed(1)} gal</div></div>
            <div class="stat-card"><div class="stat-label">Duration</div><div class="stat-value">${fmtDur(dur)}</div></div>
        </div>`;
    }

    /// Touchdown numbers. Lives on the Summary tab rather than the always-on
    /// header, so the flight identity stays short and the landing reads as one
    /// thing next to the attitude it was flown at.
    function landingHtml() {
        const events = state.summary.events || [];
        const lEvt = events.filter(e => (e.eventType||e.event_type) === 'landing').pop();
        if (!lEvt) return '';
        const lvs = lEvt.touchdownFpm || lEvt.touchdown_fpm;
        const g = lEvt.landingG || lEvt.landing_g;
        const off = lEvt.offsetPercent || lEvt.offset_percent;
        const thr = lEvt.thresholdDistFt || lEvt.threshold_dist_ft;
        const stab = lEvt.approachStability || lEvt.approach_stability;
        return `<div class="landing-card"><div class="section-title">Landing Performance</div><div class="landing-grid">
            ${lvs != null ? `<div><div class="li-label">Touchdown VS</div><div class="li-val">${Math.round(lvs)} fpm</div></div>` : ''}
            ${g != null ? `<div><div class="li-label">Landing G</div><div class="li-val">${g.toFixed(2)} G</div></div>` : ''}
            ${off != null ? `<div><div class="li-label">Offset</div><div class="li-val">${off.toFixed(1)}%</div></div>` : ''}
            ${thr != null ? `<div><div class="li-label">Threshold</div><div class="li-val">${Math.round(thr)} ft</div></div>` : ''}
            ${stab != null ? `<div><div class="li-label">Approach Stability</div><div class="li-val">${Math.round(stab)}</div></div>` : ''}
        </div></div>`;
    }

    function drawHeader() {
        document.getElementById('header-mount').innerHTML = headerHtml();
        const sm = document.getElementById('stats-mount');
        if (sm) sm.innerHTML = statsHtml();
        const lm = document.getElementById('landing-mount');
        if (lm) lm.innerHTML = landingHtml();
        // The shell's title bar names the record you are looking at; only the
        // renderer knows the route, so it fills it in.
        const bar = document.getElementById('view-route');
        if (bar) {
            const sum = state.summary;
            const dep = sum.startIcao || sum.departure || '';
            const arr = sum.endIcao || sum.arrival || '';
            if (dep || arr) bar.textContent = `${dep} → ${arr}`;
        }
    }

    function eventMarkersOnMap() {
        if (!state.map) return;
        (state.summary.events || []).forEach(e => {
            const type = e.eventType||e.event_type;
            if (!e.latitude || !e.longitude) return;
            const key = type + '|' + e.timestamp;
            state.map._blSeen = state.map._blSeen || {};
            if (state.map._blSeen[key]) return;
            state.map._blSeen[key] = true;
            const color = type==='takeoff'?'#a6e3a1':type==='landing'?'#f38ba8':'#89b4fa';
            const label = type==='takeoff'?'Takeoff':type==='landing'?'Landing':type==='top_of_climb'?'TOC':'TOD';
            L.circleMarker([e.latitude,e.longitude],{radius:7,color,fillColor:color,fillOpacity:0.9,weight:2}).bindTooltip(label).addTo(state.map);
        });
    }

    function drawMap() {
        if (state.lats.length === 0) { document.getElementById('map').style.display = 'none'; return; }
        document.getElementById('map').style.display = '';
        const coords = state.lats.map((la, i) => [la, state.lons[i]]);
        if (!state.map) {
            state.map = L.map('map');
            // Esri's Dark Gray Canvas. CARTO's keyless basemap now serves tiles
            // watermarked "API KEY REQUIRED" - still HTTP 200, so nothing errors,
            // the notice is painted into the image. Esri needs no key and is
            // already a dependency here (the 3D view textures terrain from it).
            // Its canvas stops at z16, so maxNativeZoom upscales past that rather
            // than fetching the "Map data not yet available" placeholder.
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',{attribution:'Esri, HERE, Garmin, &copy; OpenStreetMap contributors',maxZoom:19,maxNativeZoom:16}).addTo(state.map);
            state.path = L.polyline(coords,{color:'#ffb000',weight:2.5,opacity:0.9}).addTo(state.map);
            state.map.fitBounds(state.path.getBounds().pad(0.12), { maxZoom: 16 });
            // Once the viewer pans or zooms, stop stealing the view from them on
            // every poll.
            state.map.on('dragstart zoomstart', () => { state.userMoved = true; });
        } else {
            state.path.setLatLngs(coords);
            if (!state.userMoved) state.map.fitBounds(state.path.getBounds().pad(0.12), { maxZoom: 16 });
        }
        eventMarkersOnMap();
    }

    /// The flight's timeline: one position per sample, with dead air capped.
    ///
    /// Real flights are full of it - a log left running on the ramp for two
    /// hours, a dropout mid-cruise - and the uploader deliberately thins cruise
    /// to one sample every few minutes. Plotting wall-clock time linearly hands
    /// almost the whole axis to an empty ramp: on a real share here, a
    /// two-hour-46 gap squeezed the entire flight into the right-hand 3% of
    /// every chart. So cap what any one gap may occupy, scaled to how often
    /// this flight actually sampled, and plot against that.
    ///
    /// Everything time-shaped on the page rides this axis: the four charts, the
    /// event and screenshot marks, and the replay cursor. Tick labels and
    /// tooltips convert back, so the clock a viewer reads is always real.
    function rebuildAxis() {
        const ts = state.timestamps;
        state.axis = [0];
        state.gaps = [];
        if (ts.length < 2) return;
        const gaps = [];
        for (let i=1; i<ts.length; i++) gaps.push(ts[i] - ts[i-1]);
        const sorted = gaps.slice().sort((a,b)=>a-b);
        const cap = Math.max(60, (sorted[sorted.length>>1] || 1) * 4);
        for (let i=1; i<ts.length; i++) {
            state.axis.push(state.axis[i-1] + Math.min(gaps[i-1], cap));
            // Remember what was compressed, so the charts can say so rather
            // than quietly presenting skipped hours as continuous flight.
            if (gaps[i-1] > cap) state.gaps.push({from: state.axis[i-1], to: state.axis[i], skipped: gaps[i-1]});
        }
    }

    /// Greatest index at or before `v` in a sorted array.
    function floorIndex(arr, v) {
        let lo = 0, hi = arr.length - 1;
        while (lo < hi) { const mid = (lo+hi+1)>>1; if (arr[mid] <= v) lo = mid; else hi = mid-1; }
        return lo;
    }

    function epochToAxis(epoch) {
        const ts = state.timestamps, ax = state.axis;
        if (!ax || ax.length === 0) return 0;
        const last = ts.length - 1;
        if (epoch <= ts[0]) return 0;
        if (epoch >= ts[last]) return ax[last];
        const i = floorIndex(ts, epoch), j = Math.min(i+1, last);
        const dt = ts[j] - ts[i];
        return ax[i] + (ax[j] - ax[i]) * (dt > 0 ? (epoch - ts[i]) / dt : 0);
    }

    function axisToEpoch(x) {
        const ts = state.timestamps, ax = state.axis;
        if (!ax || ax.length === 0) return ts[0] || 0;
        const last = ax.length - 1;
        if (x <= 0) return ts[0];
        if (x >= ax[last]) return ts[last];
        const i = floorIndex(ax, x), j = Math.min(i+1, last);
        const d = ax[j] - ax[i];
        return ts[i] + (ts[j] - ts[i]) * (d > 0 ? (x - ax[i]) / d : 0);
    }

    const clockAt = x => new Date(axisToEpoch(x) * 1000).toISOString().slice(11, 16);

    /// True when this flight actually carries a series. An array is either
    /// full-length or empty: the service only sends a column some sample filled.
    function hasData(key) {
        const a = state[key];
        return Array.isArray(a) && a.length > 0;
    }

    /// A close satellite view of where the flight actually touched down.
    ///
    /// The overview map is drawn on the dark canvas, which stops at z16 and
    /// would be an upscaled blur at the scale that shows a runway. Imagery is
    /// tiled past z19 and is the point here anyway: on a runway diagram you
    /// want to see the surface, not a drawing of it.
    ///
    /// Framed on the last stretch of the approach rather than on the touchdown
    /// point alone - a single point gives degenerate bounds, and seeing the
    /// final few miles is what puts the touchdown in the context of the airport
    /// around it.
    function drawTouchdownMap() {
        const host = document.getElementById('map-touchdown');
        const section = document.getElementById('touchdown-section');
        if (!host || state.touchdownMap) return;

        const events = state.summary.events || [];
        const lEvt = events.filter(e => (e.eventType||e.event_type) === 'landing').pop();
        if (!lEvt || !lEvt.latitude || !lEvt.longitude) {
            if (section) section.style.display = 'none';
            return;
        }
        if (section) section.style.display = '';
        const td = [lEvt.latitude, lEvt.longitude];

        // The approach: samples inside the last three minutes before touchdown,
        // which is a few miles at any light-aircraft or airliner speed.
        let epoch = null;
        try { epoch = new Date(String(lEvt.timestamp).replace(' ', 'T') + 'Z').getTime() / 1000; } catch (_) {}
        const approach = [];
        if (epoch) {
            for (let i = 0; i < state.timestamps.length; i++) {
                const dt = epoch - state.timestamps[i];
                if (dt >= -30 && dt <= 180) approach.push([state.lats[i], state.lons[i]]);
            }
        }

        const map = L.map('map-touchdown', { zoomControl: true });
        state.touchdownMap = map;
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Esri, Maxar, Earthstar Geographics',
            maxNativeZoom: 19,
            maxZoom: 20,
        }).addTo(map);

        if (approach.length > 1) {
            // Cased, because a thin line disappears against aerial photography.
            L.polyline(approach, { color: '#000000', weight: 6, opacity: 0.45 }).addTo(map);
            L.polyline(approach, { color: '#ffb000', weight: 2.5, opacity: 1 }).addTo(map);
        }

        // Frame the airport, not the arrival. Fitting the whole approach pulls
        // the view out to a dozen miles - the aeroplane spends most of it far
        // from the field - and the runway becomes a scratch. Box the touchdown
        // point at roughly a mile across instead, which is the size of an
        // airport, and let the approach line run off the edge.
        const NM = 1 / 60;                       // degrees of latitude per nm
        const halfLat = 0.6 * NM;
        const halfLon = halfLat / Math.max(0.2, Math.cos(td[0] * Math.PI / 180));
        map.fitBounds(L.latLngBounds(
            [td[0] - halfLat, td[1] - halfLon],
            [td[0] + halfLat, td[1] + halfLon],
        ), { maxZoom: 17 });

        L.circleMarker(td, { radius: 7, color: '#ffffff', fillColor: '#ff7a8a', fillOpacity: 1, weight: 2 })
            .addTo(map)
            .bindTooltip('Touchdown', { permanent: false });
    }

    // Chart series, thinned to ~300 points so a long flight stays responsive.
    // One entry per plottable key, so adding a column upstream is the only
    // change needed to get a chart for it.
    const SERIES_KEYS = ['alts', 'vs', 'ias', 'pitch', 'roll', 'heading', 'track', 'ground_speed', 'true_airspeed', 'baro', 'magvar', 'g_load', 'oat', 'wind_speed', 'wind_dir', 'fuel_flow', 'fuel_left', 'fuel_right', 'rpm', 'pct_power', 'manifold', 'oil_temp', 'oil_press'];

    function buildSeries() {
        const ts = state.timestamps;
        const step = Math.max(1, Math.floor(ts.length / 300));
        const out = { sampledTs: [], t0: ts[0] };
        SERIES_KEYS.forEach(k => { if (hasData(k)) out[k] = []; });
        for (let i = 0; i < ts.length; i += step) {
            const x = state.axis[i];
            SERIES_KEYS.forEach(k => {
                if (out[k]) out[k].push({ x, y: state[k][i] || 0 });
            });
            out.sampledTs.push(ts[i]);
        }
        return out;
    }

    function drawCharts() {
        if (state.timestamps.length === 0) return;
        const series = buildSeries();
        if (state.charts.length) {
            // Rebuilding the datasets and updating in place is cheap at these
            // sizes and avoids tearing down the canvases every poll. The chart
            // order is the order PLOTS created them in.
            state.charts.forEach((c, i) => {
                const key = state.chartKeys[i];
                if (series[key]) { c.data.datasets[0].data = series[key]; c.update('none'); }
            });
            return;
        }
        const evColor = t => (t==='takeoff'||t==='top_of_climb')?'#a6e3a1':t==='landing'?'#f38ba8':t==='top_of_descent'?'#f9b387':(t==='autopilot_on'||t==='autopilot_off')?'#89b4fa':'#cba6f7';
        const evLabel = t => t==='takeoff'?'LIFT OFF':t==='landing'?'TOUCHDOWN':t==='top_of_climb'?'TOC':t==='top_of_descent'?'TOD':t==='autopilot_on'?'AP ON':t==='autopilot_off'?'AP OFF':t;
        const eventMarks = [], shotMarks = [];
        function remapMarks() {
            eventMarks.length = 0; shotMarks.length = 0;
            const s = buildSeries();
            const gap = s.sampledTs.length>1 ? Math.abs(s.sampledTs[1]-s.sampledTs[0]) : 30;
            (state.summary.events || []).forEach(e => {
                const type = e.eventType||e.event_type;
                const ets = e.timestamp;
                if (!ets) return;
                let epoch;
                try { epoch = new Date(ets.replace(' ','T')+'Z').getTime()/1000; } catch (_) { return; }
                if (!epoch || isNaN(epoch)) return;
                let bi=-1, bd=Infinity;
                for (let i=0;i<s.sampledTs.length;i++) { const dd=Math.abs(s.sampledTs[i]-epoch); if (dd<bd) { bd=dd; bi=i; } }
                if (bi<0 || bd > gap*1.5 + 30) return;
                eventMarks.push({x:epochToAxis(epoch), color:evColor(type), label:evLabel(type)});
            });
            state.screenshots.forEach((sc, i) => {
                let epoch = null;
                if (typeof sc.timestamp === 'number') epoch = sc.timestamp;
                else if (sc.timestamp) { try { epoch = new Date(String(sc.timestamp).replace(' ','T')+'Z').getTime()/1000; } catch (_) { epoch = null; } }
                if (!epoch || isNaN(epoch)) return;
                let bi=-1, bd=Infinity;
                for (let j=0;j<s.sampledTs.length;j++) { const dd=Math.abs(s.sampledTs[j]-epoch); if (dd<bd) { bd=dd; bi=j; } }
                if (bi<0 || bd > gap*1.5 + 30) return;
                shotMarks.push({x:epochToAxis(epoch), lb:i});
            });
        }
        remapMarks();
        state.remapMarks = remapMarks;
        const shotHit = (chart, x, y) => {
            const xs = chart.scales.x, area = chart.chartArea;
            if (!xs || !area || y < area.bottom - 22) return -1;
            let best=-1, bestd=10;
            shotMarks.forEach(m => { const dd=Math.abs(xs.getPixelForValue(m.x)-x); if (dd<bestd) { bestd=dd; best=m.lb; } });
            return best;
        };
        const fmtSkip = secs => {
            const h = Math.floor(secs/3600), m = Math.round(secs%3600/60);
            return h > 0 ? `${h}h${String(m).padStart(2,'0')}` : `${m}m`;
        };
        const eventMarkerPlugin = {
            id:'eventMarkers',
            afterDatasetsDraw(chart) {
                const ctx = chart.ctx, area = chart.chartArea, xs = chart.scales.x;
                if (!area || !xs) return;
                ctx.save();
                // Compressed dead air, shaded and labelled. Without this the
                // axis silently claims two hours on the ramp took a minute.
                ctx.font = '9px sans-serif';
                ctx.textAlign = 'center';
                (state.gaps || []).forEach(g => {
                    const x1 = xs.getPixelForValue(g.from), x2 = xs.getPixelForValue(g.to);
                    if (x1 == null || x2 == null || isNaN(x1) || isNaN(x2)) return;
                    const l = Math.max(area.left, Math.min(x1, x2)), r = Math.min(area.right, Math.max(x1, x2));
                    if (r <= l) return;
                    ctx.fillStyle = 'rgba(255,255,255,0.05)';
                    ctx.fillRect(l, area.top, r - l, area.bottom - area.top);
                    ctx.fillStyle = '#6c7086';
                    ctx.fillText('⋯ ' + fmtSkip(g.skipped), (l + r) / 2, area.bottom - 4);
                });
                eventMarks.forEach(mm => {
                    const px = xs.getPixelForValue(mm.x);
                    if (px==null || isNaN(px)) return;
                    ctx.beginPath();
                    ctx.setLineDash([4,3]);
                    ctx.moveTo(px, area.top);
                    ctx.lineTo(px, area.bottom);
                    ctx.lineWidth = 1.5;
                    ctx.strokeStyle = mm.color;
                    ctx.stroke();
                    ctx.setLineDash([]);
                    ctx.fillStyle = mm.color;
                    ctx.fillText(mm.label, px, area.top + 8);
                });
                ctx.font = '12px sans-serif';
                ctx.textBaseline = 'bottom';
                ctx.strokeStyle = '#9399b2';
                shotMarks.forEach(m => {
                    const px = xs.getPixelForValue(m.x);
                    if (px==null || isNaN(px)) return;
                    ctx.beginPath();
                    ctx.setLineDash([]);
                    ctx.moveTo(px, area.bottom);
                    ctx.lineTo(px, area.bottom - 12);
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                    ctx.fillText('📷', px, area.bottom - 12);
                });
                ctx.restore();
            }
        };
        const opts = () => ({
            responsive:true, maintainAspectRatio:true, animation:false,
            plugins:{legend:{display:false},tooltip:{mode:'index',intersect:false,callbacks:{title:(items)=>items.length?clockAt(items[0].parsed.x):''}}},
            scales:{
                x:{type:'linear',ticks:{color:'#6c7086',maxTicksLimit:6,callback:(v)=>clockAt(v)},grid:{color:'rgba(255,255,255,0.04)'}},
                y:{ticks:{color:'#6c7086'},grid:{color:'rgba(255,255,255,0.04)'}},
            },
            onClick:(evt, els, chart) => {
                const lb = shotHit(chart, evt.x, evt.y);
                if (lb >= 0 && typeof openLb === 'function') openLb(lb);
            },
            onHover:(evt, els, chart) => {
                chart.canvas.style.cursor = shotHit(chart, evt.x, evt.y) >= 0 ? 'pointer' : 'default';
            },
        });
        const mk = (id2, lbl, data, color, key) => {
            const el = document.createElement('div'); el.className='chart-card';
            el.innerHTML=`<div class="section-title">${lbl}</div><canvas id="${id2}"></canvas><div class="chart-cursor"></div>`;
            document.getElementById('charts-mount').appendChild(el);
            state.charts.push(new Chart(document.getElementById(id2),{type:'line',data:{datasets:[{label:lbl,data,borderColor:color,backgroundColor:color+'22',borderWidth:1.5,pointRadius:0,fill:true,tension:0.2}]},options:opts(),plugins:[eventMarkerPlugin]}));
            state.cursors.push(el.querySelector('.chart-cursor'));
            state.chartKeys.push(key);
        };
        // Every per-sample series the track carries, plus ground speed derived
        // from the fixes. Attitude is paired last so pitch and roll read
        // together, the way they are flown.
        // Every per-sample series, in reading order: how high and how fast up,
        // how fast forward and through what air, where it pointed and how hard
        // it turned, how it was held, then what the engine and tanks were doing.
        // A series with no data for this flight is skipped rather than drawn
        // empty - most of the engine channels only exist on piston singles.
        const PLOTS = [
            ['ca', 'Altitude (ft)',        'alts',          '#ffb000'],
            ['cv', 'Vert Speed (fpm)',     'vs',            '#ff7a8a'],
            ['ci', 'Airspeed IAS (kt)',    'ias',           '#36e3c6'],
            ['cg', 'Ground Speed (kt)',    'ground_speed',  '#7aa2f7'],
            ['cs', 'True Airspeed (kt)',   'true_airspeed', '#5ad6c0'],
            ['ch', 'Heading (°)',          'heading',       '#9ece6a'],
            ['ck', 'Ground Track (°)',     'track',         '#8fc866'],
            ['cp', 'Pitch (°)',            'pitch',         '#ffc23d'],
            ['cr', 'Roll (°)',             'roll',          '#c9a0ff'],
            ['cn', 'Load Factor (G)',      'g_load',        '#ff9e64'],
            ['cb', 'Altimeter (inHg)',     'baro',          '#a5b4c8'],
            ['co', 'Outside Air Temp (°C)','oat',           '#7dcfff'],
            ['cws','Wind Speed (kt)',      'wind_speed',    '#89ddff'],
            ['cwd','Wind Direction (°)',   'wind_dir',      '#6ea8c7'],
            ['cff','Fuel Flow (gph)',      'fuel_flow',     '#f7a072'],
            ['cfl','Fuel Left (gal)',      'fuel_left',     '#e0af68'],
            ['cfr','Fuel Right (gal)',     'fuel_right',    '#d8a25f'],
            ['crp','Engine RPM',           'rpm',           '#bb9af7'],
            ['cpw','Power (%)',            'pct_power',     '#c3a6ff'],
            ['cmp','Manifold (inHg)',      'manifold',      '#9d86d6'],
            ['cot','Oil Temp (°F)',        'oil_temp',      '#ff7a8a'],
            ['cop','Oil Pressure (psi)',   'oil_press',     '#e06c8a'],
        ];
        PLOTS.forEach(([id2, label, key, color]) => {
            if (!hasData(key)) return;
            mk(id2, label, series[key], color, key);
        });
    }

    function drawGallery() {
        if (state.screenshots.length === 0) return;
        const urls = state.screenshots.map(s=>s.url);
        window._lbUrls = urls;
        const thumbs = urls.map((u,i)=>`<img src="${u}" loading="lazy" onclick="openLb(${i})" alt="">`).join('');
        document.getElementById('gallery-mount').innerHTML=`<div class="gallery-section"><div class="section-title">Screenshots</div><div class="gallery">${thumbs}</div></div>`;
    }

    rebuildAxis();
    drawHeader();
    drawGallery();
    drawMap();
    drawTouchdownMap();
    drawCharts();

    // Where the replay cursor sits, so re-showing a pane can restore it.
    let lastProgress = 0;

    // Drop a marker at a reported position. Used by the live page for the
    // aircraft's current fix and by replay for the interpolated one.
    function setCurrentPos(pos) {
        if (!pos || !state.map) return;
        const ll = [pos.latitude, pos.longitude];
        if (!state.planeMarker) {
            state.planeMarker = L.circleMarker(ll, {radius:6,color:'#ffffff',fillColor:'#ffb000',fillOpacity:1,weight:2}).addTo(state.map);
            state.planeMarker.bindTooltip('');
        } else {
            state.planeMarker.setLatLng(ll);
        }
        // Re-binding on every frame of a replay would rebuild the tooltip 60
        // times a second; set the text on the binding that is already there.
        state.planeMarker.setTooltipContent(`${Math.round(pos.altitude)} ft · ${Math.round(pos.speed)} kt · ${Math.round(pos.heading)}°`);
    }

    // Place the replay cursor on each chart. Takes a position on the shared
    // axis, which is what the charts are plotted against. A positioned overlay
    // rather than a canvas repaint: redrawing four Chart.js canvases per frame
    // is what made the replay stutter.
    function positionChartCursors(seconds) {
        for (let i = 0; i < state.charts.length; i++) {
            const chart = state.charts[i], cur = state.cursors[i];
            if (!chart || !cur) continue;
            const xs = chart.scales.x, area = chart.chartArea;
            const px = (xs && area && seconds >= xs.min && seconds <= xs.max) ? xs.getPixelForValue(seconds) : null;
            if (px == null || isNaN(px)) { cur.style.display = 'none'; continue; }
            const cv = chart.canvas;
            cur.style.display = '';
            cur.style.top = (cv.offsetTop + area.top) + 'px';
            cur.style.height = (area.bottom - area.top) + 'px';
            cur.style.transform = `translateX(${(cv.offsetLeft + px).toFixed(1)}px)`;
        }
    }

    return {
        state,
        /// Hand the flight to the replay transport and wire every view on the
        /// page to its cursor. Only meaningful once the track is complete, so
        /// the live page calls this when the flight ends and the share page
        /// calls it straight away. Returns false if there is nothing to replay.
        enableReplay() {
            if (typeof FlightReplay === 'undefined' || !FlightReplay.attach(state)) return false;
            FlightReplay.subscribe(ev => {
                lastProgress = ev.progress;
                const s = ev.sample;
                // A recorded heading is magnetic once the sim's variation is
                // taken off - the same rule extract_current applies to the live
                // snapshot. Without one, fall back to course over ground from
                // the fixes, and say so rather than passing it off as a heading.
                const magnetic = s.heading === null ? null
                    : (((attSign < 0 ? s.heading - (s.magvar || 0) : s.heading) % 360) + 360) % 360;
                if (typeof renderPFDSample === 'function') renderPFDSample({
                    pitch: s.pitch, roll: s.roll,
                    ias: s.ias, altitude: s.altitude, baro: s.baro,
                    heading: magnetic === null ? s.track : magnetic,
                    headingLabel: magnetic === null ? 'GROUND TRACK · TRUE' : 'MAGNETIC HEADING',
                    caption: new Date(s.epoch * 1000).toISOString().slice(11, 19) + 'Z',
                    animate: false,
                });
                setCurrentPos({ latitude: s.latitude, longitude: s.longitude, altitude: s.altitude,
                                speed: s.groundSpeed === null ? s.ias : s.groundSpeed, heading: s.track });
                positionChartCursors(ev.axis);
            });
            return true;
        },
        /// Append a delta document's samples and redraw the moving parts.
        append(doc) {
            const t = doc.transposedData || doc.transposed_data || {};
            const ts = reconstructTs(t.timestamps);
            if (ts.length) {
                state.timestamps = state.timestamps.concat(ts);
                state.lats = state.lats.concat(t.latitudes || []);
                state.lons = state.lons.concat(t.longitudes || []);
                state.alts = state.alts.concat(t.altitudes || []);
                state.ias = state.ias.concat(t.ias || []);
                state.vs = state.vs.concat(t.vspeed || []);
                state.pitch = state.pitch.concat(att(t.pitch));
                state.roll = state.roll.concat(att(t.roll));
                state.heading = state.heading.concat(t.heading || []);
                state.track = state.track.concat(t.track || []);
                state.ground_speed = state.ground_speed.concat(t.ground_speed || []);
                state.true_airspeed = state.true_airspeed.concat(t.true_airspeed || []);
                state.baro = state.baro.concat(t.baro || []);
                state.magvar = state.magvar.concat(t.magvar || []);
                state.g_load = state.g_load.concat(t.g_load || []);
                state.oat = state.oat.concat(t.oat || []);
                state.wind_speed = state.wind_speed.concat(t.wind_speed || []);
                state.wind_dir = state.wind_dir.concat(t.wind_dir || []);
                state.fuel_flow = state.fuel_flow.concat(t.fuel_flow || []);
                state.fuel_left = state.fuel_left.concat(t.fuel_left || []);
                state.fuel_right = state.fuel_right.concat(t.fuel_right || []);
                state.rpm = state.rpm.concat(t.rpm || []);
                state.pct_power = state.pct_power.concat(t.pct_power || []);
                state.manifold = state.manifold.concat(t.manifold || []);
                state.oil_temp = state.oil_temp.concat(t.oil_temp || []);
                state.oil_press = state.oil_press.concat(t.oil_press || []);
                rebuildAxis();
            }
            if (doc.summary) state.summary = doc.summary;
            if (doc.screenshots) {
                const grew = doc.screenshots.length !== state.screenshots.length;
                state.screenshots = doc.screenshots;
                if (grew) drawGallery();
            }
            if (ts.length || doc.summary) {
                drawHeader();
                drawMap();
                if (state.remapMarks) state.remapMarks();
                drawCharts();
            }
        },
        /// Drop a marker at the aircraft's reported position, so a viewer sees
        /// where it is even before the next track sample lands.
        setCurrent: setCurrentPos,
        /// Call when a pane becomes visible. Leaflet and Chart.js both measure
        /// their container at creation, so anything built inside a hidden pane
        /// comes back zero-sized until told to measure again.
        onPaneShown(name) {
            if (name === 'maps') {
                drawTouchdownMap();
                if (state.map) state.map.invalidateSize();
                if (state.touchdownMap) state.touchdownMap.invalidateSize();
                if (window.flightDeck) window.flightDeck.redraw(true);
            } else if (name === 'graphs') {
                state.charts.forEach(c => c.resize());
                // Chart pixels just moved, so the replay cursor has to follow.
                if (typeof FlightReplay !== 'undefined' && FlightReplay.ready()) FlightReplay.seek(lastProgress);
            }
        },
    };
}

// 3D flight path over real terrain (deck.gl + free AWS terrarium elevation
// tiles textured with ESRI World Imagery — no API key). Renders the track as an
// altitude-graded line floating above the terrain mesh, with an animated marker.
//
// Only meaningful once the track is complete: the camera fit and the playback
// scrub both assume the whole flight is present, so the live page holds this
// back until the flight ends rather than re-framing under the viewer every poll.
function renderFlight3D(d) {
    if (typeof deck === 'undefined' || !deck.TerrainLayer) return;
    const td = d.transposedData || d.transposed_data || {};
    const lats = td.latitudes || [], lons = td.longitudes || [], altsFt = td.altitudes || [];
    if (lats.length < 2) return;
    const M = 0.3048; // feet → metres (MSL, matches terrain elevation)

    const N = lats.length, cap = 800, step = Math.max(1, Math.floor(N / cap));

    // True-scale altitude is only a few pixels tall against a whole flight, so the
    // climb is invisible. Scale height up — terrain AND track by the same factor,
    // to keep the above-ground relationship honest — until it reads at a glance.
    // Adaptive: aim for the peak to stand ~18% of the flight's ground span tall.
    let maxAltFt = 0, minLng = Infinity, minLat = Infinity, maxLng = -Infinity, maxLat = -Infinity;
    for (let i = 0; i < N; i++) {
        if (altsFt[i] > maxAltFt) maxAltFt = altsFt[i];
        if (lons[i] < minLng) minLng = lons[i]; if (lons[i] > maxLng) maxLng = lons[i];
        if (lats[i] < minLat) minLat = lats[i]; if (lats[i] > maxLat) maxLat = lats[i];
    }
    const wM = (maxLng - minLng) * 111320 * Math.cos((minLat + maxLat) / 2 * Math.PI / 180);
    const hM = (maxLat - minLat) * 111320, diagM = Math.hypot(wM, hM) || 1;
    const maxAltM = maxAltFt * M;
    const EXAG = Math.max(1, Math.min(8, maxAltM > 0 ? (0.18 * diagM) / maxAltM : 1));
    const Z = M * EXAG; // feet → exaggerated metres

    // Downsample to keep the geometry light on long flights.
    const pts = [];
    for (let i = 0; i < N; i += step) pts.push([lons[i], lats[i], (altsFt[i] || 0) * Z]);
    const last = N - 1;
    if (pts[pts.length - 1][0] !== lons[last] || pts[pts.length - 1][1] !== lats[last])
        pts.push([lons[last], lats[last], (altsFt[last] || 0) * Z]);
    // Altitude → colour: teal (low) to amber (high), matching the site palette.
    const altColor = ft => {
        const x = Math.max(0, Math.min(1, maxAltFt ? ft / maxAltFt : 0));
        return [Math.round(54 + 201 * x), Math.round(227 - 51 * x), Math.round(198 - 198 * x)];
    };
    const segs = [];
    for (let i = 0; i < pts.length - 1; i++) segs.push({ path: [pts[i], pts[i + 1]], color: altColor(pts[i][2] / Z) });
    // Faint vertical "curtain" dropping from the track to the ground to convey height.
    const drops = [], dstep = Math.max(1, Math.floor(pts.length / 60));
    for (let i = 0; i < pts.length; i += dstep) drops.push({ path: [pts[i], [pts[i][0], pts[i][1], 0]] });

    const events = (d.summary && d.summary.events) || [];
    const evLabel = t => t === 'takeoff' ? 'Takeoff' : t === 'landing' ? 'Landing' : t === 'top_of_climb' ? 'TOC' : t === 'top_of_descent' ? 'TOD' : t;
    const evColor = t => t === 'takeoff' ? [90, 209, 126] : t === 'landing' ? [255, 122, 138] : [54, 227, 198];
    const evPts = events.filter(e => e.latitude && e.longitude).map(e => {
        const type = e.eventType || e.event_type;
        return { position: [e.longitude, e.latitude, (e.altitude || 0) * Z], color: evColor(type), label: evLabel(type) };
    });

    // Fit the horizontal extent (bounds already computed above), tilt, look along route.
    const section = document.getElementById('map3d-section');
    section.style.display = ''; // size the container before measuring / creating Deck
    const el = document.getElementById('map3d');
    const vp = new deck.WebMercatorViewport({ width: el.clientWidth || 800, height: el.clientHeight || 480 });
    const fit = vp.fitBounds([[minLng, minLat], [maxLng, maxLat]], { padding: 60 });
    const bearing = (() => {
        const r = Math.PI / 180, a = pts[0], b = pts[pts.length - 1], dLon = (b[0] - a[0]) * r;
        const y = Math.sin(dLon) * Math.cos(b[1] * r);
        const x = Math.cos(a[1] * r) * Math.sin(b[1] * r) - Math.sin(a[1] * r) * Math.cos(b[1] * r) * Math.cos(dLon);
        return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    })();
    const initView = { longitude: fit.longitude, latitude: fit.latitude, zoom: Math.max(1, fit.zoom - 0.6), pitch: 58, bearing, maxPitch: 85 };

    const terrain = new deck.TerrainLayer({
        id: 'terrain', minZoom: 0, maxZoom: 14,
        elevationDecoder: { rScaler: 256 * EXAG, gScaler: EXAG, bScaler: EXAG / 256, offset: -32768 * EXAG },
        elevationData: 'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png',
        texture: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        operation: 'terrain+draw',
    });
    const statics = [
        terrain,
        new deck.PathLayer({ id: 'drops', data: drops, getPath: p => p.path, getColor: [255, 176, 0, 45], widthUnits: 'pixels', getWidth: 1, widthMinPixels: 1 }),
        new deck.PathLayer({ id: 'track', data: segs, getPath: p => p.path, getColor: p => p.color, widthUnits: 'pixels', getWidth: 4, widthMinPixels: 2, capRounded: true, jointRounded: true }),
        new deck.ScatterplotLayer({ id: 'events', data: evPts, getPosition: e => e.position, getRadius: 6, radiusUnits: 'pixels', getFillColor: e => e.color, stroked: true, getLineColor: [10, 12, 13], lineWidthMinPixels: 1.5 }),
        new deck.TextLayer({ id: 'evlabels', data: evPts, getPosition: e => e.position, getText: e => e.label, getSize: 11, getColor: [238, 241, 234], getPixelOffset: [0, -14], fontFamily: 'monospace', background: true, getBackgroundColor: [16, 19, 20, 190], backgroundPadding: [4, 2] }),
    ];
    const marker = pos => [
        new deck.ScatterplotLayer({ id: 'plane-glow', data: [pos], getPosition: p => p, getRadius: 14, radiusUnits: 'pixels', getFillColor: [255, 176, 0, 70] }),
        new deck.ScatterplotLayer({ id: 'plane', data: [pos], getPosition: p => p, getRadius: 6, radiusUnits: 'pixels', getFillColor: [255, 255, 255], stroked: true, getLineColor: [255, 176, 0], lineWidthMinPixels: 2 }),
    ];

    // Track the live view so the tilt slider can change pitch without losing pan/zoom.
    let curView = { ...initView };
    const pitchSlider = document.getElementById('m3d-pitch');
    const deckgl = new deck.Deck({
        canvas: 'deck3d', initialViewState: initView,
        controller: { dragRotate: true, inertia: true },
        onViewStateChange: ({ viewState }) => { curView = viewState; pitchSlider.value = Math.round(viewState.pitch); },
        layers: [...statics, ...marker(pts[0])],
    });
    window.flightDeck = deckgl;
    pitchSlider.oninput = () => { curView = { ...curView, pitch: +pitchSlider.value }; deckgl.setProps({ initialViewState: curView }); };
    document.getElementById('m3d-maxalt').textContent = Math.round(maxAltFt).toLocaleString() + ' ft';
    document.getElementById('m3d-exag').textContent = EXAG > 1.05 ? 'vertical ×' + EXAG.toFixed(1) + ' (exaggerated)' : '';

    // Playback. The panel's button and slider are a second view onto the page's
    // one replay cursor, not a transport of their own - two scrubbers
    // disagreeing about where the flight is would be worse than none.
    const playBtn = document.getElementById('m3d-play'), scrub = document.getElementById('m3d-scrub');
    if (typeof FlightReplay !== 'undefined' && FlightReplay.ready()) {
        FlightReplay.subscribe(ev => {
            const p = ev.sample;
            deckgl.setProps({ layers: [...statics, ...marker([p.longitude, p.latitude, (p.altitude || 0) * Z])] });
            if (document.activeElement !== scrub) scrub.value = Math.round(ev.progress * 1000);
            playBtn.textContent = ev.playing ? '❚❚' : ev.atEnd ? '↻' : '▶';
        });
        playBtn.onclick = () => FlightReplay.toggle();
        scrub.oninput = () => FlightReplay.seek(scrub.value / 1000);
    } else {
        // No replay (no transport mounted, or a track too short to scrub): the
        // aircraft stays parked at the start rather than offering dead controls.
        playBtn.closest('.m3d-panel').style.display = 'none';
    }
    document.getElementById('m3d-reset').onclick = () => { curView = { ...initView }; pitchSlider.value = 58; deckgl.setProps({ initialViewState: { ...initView, transitionDuration: 600 } }); };
}

function openLb(i){ document.getElementById('lb-img').src=window._lbUrls[i]; document.getElementById('lightbox').classList.add('open'); document.body.style.overflow='hidden'; }
function closeLb(){ document.getElementById('lightbox').classList.remove('open'); document.body.style.overflow=''; }
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLb();});
</script>
