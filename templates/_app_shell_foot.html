    </div><!-- .app-main -->
</div><!-- .app -->
<script>
// Drawer for the narrow layout. The rail is the same element in both layouts -
// below 900px it slides in over the view instead of holding a column.
(function () {
    const rail = document.getElementById('rail');
    const scrim = document.getElementById('nav-scrim');
    const openBtn = document.getElementById('nav-open');
    if (!rail || !scrim || !openBtn) return;

    let lastFocus = null;

    function open() {
        lastFocus = document.activeElement;
        document.body.classList.add('nav-open');
        scrim.hidden = false;
        openBtn.setAttribute('aria-expanded', 'true');
        const first = rail.querySelector('.rail-item');
        if (first) first.focus();
    }
    function close() {
        document.body.classList.remove('nav-open');
        scrim.hidden = true;
        openBtn.setAttribute('aria-expanded', 'false');
        if (lastFocus && lastFocus.focus) lastFocus.focus();
    }

    openBtn.addEventListener('click', open);
    scrim.addEventListener('click', close);
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && document.body.classList.contains('nav-open')) close();
    });
    // Leaving the narrow layout with the drawer open would otherwise strand the
    // scrim over a rail that is now a permanent column.
    const wide = window.matchMedia('(min-width: 900px)');
    (wide.addEventListener ? wide.addEventListener.bind(wide, 'change') : wide.addListener.bind(wide))(
        e => { if (e.matches) close(); }
    );
})();

// Theme toggle, in the rail rather than floating over the content.
(function () {
    const btn = document.getElementById('theme-toggle');
    if (!btn) return;
    btn.addEventListener('click', function () {
        const root = document.documentElement;
        const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        const current = root.getAttribute('data-theme') || (prefersLight ? 'light' : 'dark');
        const next = current === 'light' ? 'dark' : 'light';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('butterlog-theme', next); } catch (e) {}
    });
})();
</script>
