<!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>ButterLog Service</title>
            {% include "_theme_head.html" %}
            <style>
                * { box-sizing: border-box; }
                body {
                    font-family: var(--font-body);
                    background: var(--bg);
                    color: var(--text);
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    min-height: 100vh;
                    margin: 0;
                }
                .container {
                    text-align: center;
                    background: var(--surface);
                    padding: 3rem 2.5rem;
                    border-radius: var(--radius);
                    box-shadow: var(--shadow);
                    border: 1px solid var(--border);
                    max-width: 420px;
                    width: 90%;
                }
                .eyebrow {
                    font-family: var(--font-mono);
                    font-size: 0.72rem;
                    letter-spacing: 0.1em;
                    text-transform: uppercase;
                    color: var(--teal-text);
                    margin-bottom: 1.25rem;
                }
                h1 {
                    font-family: var(--font-display);
                    color: var(--text);
                    margin: 0 0 1rem 0;
                    font-size: 2rem;
                    font-weight: 800;
                    letter-spacing: -0.02em;
                }
                p {
                    color: var(--text-2);
                    margin-bottom: 2rem;
                    line-height: 1.6;
                }
                .btn {
                    display: inline-block;
                    background: var(--accent);
                    color: var(--on-accent);
                    padding: 0.85rem 1.6rem;
                    border-radius: var(--radius);
                    text-decoration: none;
                    font-family: var(--font-mono);
                    font-weight: 600;
                    font-size: 0.82rem;
                    letter-spacing: 0.04em;
                    text-transform: uppercase;
                    transition: background-color var(--t);
                }
                .btn:hover { background: var(--accent-hover); }
            </style>
        </head>
        <body>
            <div class="container">
                <div class="eyebrow">ButterLog Service</div>
                <h1>ButterLog Backend</h1>
                <p>Welcome! Authenticate using your Discord account to get started.</p>
                <a href="/api/v0/auth/login" class="btn">Log In with Discord</a>
            </div>
            {% include "_theme_toggle.html" %}
        </body>
        </html>
