<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ButterLog Flight Share</title>
    <meta property="og:site_name" content="ButterLog">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/deck.gl@9.0.38/dist.min.js"></script>
    {% include "_theme_head.html" %}
    {% include "_flight_detail_style.html" %}
</head>
<body>
<div class="page">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem">
        <a href="/content" class="back" style="margin-bottom:0">← Flight History</a>
        {% if is_owner %}<button onclick="deleteShare()" style="background:transparent;color:var(--error);border:1px solid var(--border-strong);border-radius:var(--radius);padding:0.5rem 1rem;cursor:pointer;font-family:var(--font-mono);font-size:0.78rem;letter-spacing:0.04em;text-transform:uppercase" id="delete-btn">Delete Share</button>
<script>
async function deleteShare(){
    if(!confirm('Delete this shared flight? This cannot be undone.'))return;
    document.getElementById('delete-btn').textContent='Deleting...';
    document.getElementById('delete-btn').disabled=true;
    const res=await fetch('/api/v0/flights/share/{{ share_id }}',{method:'DELETE',credentials:'include'});
    if(res.ok||res.status===204){window.location.href='/content';}
    else{document.getElementById('delete-btn').textContent='Delete Share';document.getElementById('delete-btn').disabled=false;alert('Delete failed');}
}
</script>{% endif %}
    </div>
    <div id="header-mount"></div>
    <div id="gallery-mount"></div>
    <div id="map"></div>
    <div id="map3d-section" style="display:none">
        <div class="section-title" style="margin-bottom:0.75rem">3D Flight Path</div>
        <div id="map3d">
            <canvas id="deck3d"></canvas>
            <div class="m3d-panel m3d-play">
                <button id="m3d-play" title="Play flight">▶</button>
                <input id="m3d-scrub" type="range" min="0" max="1000" value="0" aria-label="Flight progress">
            </div>
            <div class="m3d-panel m3d-controls">
                <label class="m3d-tilt" title="Camera tilt">Tilt<input id="m3d-pitch" type="range" min="0" max="85" value="58" aria-label="Camera tilt angle"></label>
                <button id="m3d-reset">Reset view</button>
            </div>
            <div class="m3d-panel m3d-legend">Altitude<div class="bar"></div><div class="ends"><span>ground</span><span id="m3d-maxalt"></span></div><div id="m3d-exag" style="margin-top:0.3rem;color:var(--dim)"></div></div>
            <div class="m3d-panel m3d-hint">drag to pan · scroll to zoom · ctrl-drag to tilt</div>
        </div>
    </div>
    <div class="charts" id="charts-mount"></div>
</div>
<div id="lightbox" class="lightbox" onclick="if(event.target===this)closeLb()">
    <button class="lb-close" onclick="closeLb()">✕</button>
    <img id="lb-img" src="" alt="">
</div>
<script>
const SHARE_DATA = {{ json_escaped|safe }};
</script>
{% include "_flight_render.html" %}
<script>
// A share is a finished flight: the whole document is present up front, so both
// the 2D and 3D views render once and never change.
renderFlightDoc(SHARE_DATA);
renderFlight3D(SHARE_DATA);
</script>
</body>
</html>
