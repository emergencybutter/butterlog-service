[package]
name = "butterlog-wire"
version = "0.1.0"
edition = "2024"
description = "Sim-native telemetry wire format shared by the ButterLog app, X-Plane plugin and service"

[features]
default = ["zstd"]
# Chunk compression. The X-Plane plugin only samples and can do without it.
zstd = ["dep:zstd"]

[dependencies]
zstd = { version = "0.13", optional = true }

[dev-dependencies]
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde_json = "1"
