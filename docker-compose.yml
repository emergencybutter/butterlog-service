# Reference copy of the compose file deployed on vya2.flyvoyager.net at
# /containers/butterlog-service/docker-compose.yml. Deploys go through
# tools/service.ps1, which builds the image locally, ships it via
# `docker save | docker load`, writes this file + .env on the box, and runs
# `docker compose up -d`. There is NO on-box build (no `build:` here).
#
# vya2net is an external docker network shared with postgres18 (the DB) and
# nginx (which proxies butterlog.flyvoyager.net -> butterlog-service:8080).
# See tools/deploy-service.md for the full runbook.
services:
  butterlog-service:
    image: butterlog-service:local
    container_name: butterlog-service
    restart: unless-stopped
    env_file: .env
    networks:
      - vya2net
networks:
  vya2net:
    external: true
